<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#0a0e17] text-slate-100">
<head>
  <meta charset="UTF-8">
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Benkyō - Fournitures & Achats</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="mask-icon" href="favicon.svg" color="#c1272d">
  <meta name="theme-color" content="#0a0e17">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script defer src="sakura.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>.bg-dark-card{background-color:rgba(15, 20, 32, 0.85)}</style>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0e17; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
    
    /* Optimisation des performances du panneau en verre */
    .glass-panel { 
      background: rgba(15, 20, 32, 0.85); 
      backdrop-filter: blur(4px); 
      -webkit-backdrop-filter: blur(4px); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }
    .card-glow { transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease; }
    .card-glow:hover { border-color: rgba(232, 142, 178, 0.4); box-shadow: 0 0 20px -5px rgba(232, 142, 178, 0.25); transform: translateY(-2px); }
    
    .card-flip { perspective: 1000px; }
    .card-inner { transition: transform 0.4s ease; transform-style: preserve-3d; }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; }
    .card-back { transform: rotateY(180deg); }

    .tab-content { transition: opacity 0.2s ease-in-out; }
    .tab-content.hidden { display: none; opacity: 0; }
    .tab-content:not(.hidden) { opacity: 1; }

    @keyframes welcomeFade {
      0% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(0.95); visibility: hidden; }
    }
    .welcome-overlay { animation: welcomeFade 3s forwards ease-in-out; }
  </style>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="tailwind.css">
  <link rel="stylesheet" href="tampons.css">
</head>
<body class="h-full flex flex-col md:flex-row font-sans antialiased overflow-hidden text-slate-200 bg-[#0a0e17]">

<!-- Navigation : onglet Menu (retour à l'accueil, d'où partent toutes les pages) -->
  <a href="index.html" class="bk-menu-tab" aria-label="Menu — retour à l'accueil">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
    <span>Menu</span>
  </a>
  <!-- Éléments masqués conservés pour la compatibilité des scripts existants (ancienne sidebar supprimée) -->
  <div hidden data-legacy-stubs><div><div><span id="streak-count">0</span></div></div><img id="sidebar-profile-img" alt=""></div>

  <main class="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 relative">
    <section class="space-y-6">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-3xl font-extrabold text-white">Fournitures &amp; Achats 🛒</h1>
          <p class="text-slate-400 text-sm">Votre liste d'achats, disponible toute l'année.</p>
        </div>
        <div class="glass-panel border border-brand-cyan/30 rounded-2xl px-5 py-3 text-right">
          <div class="text-[11px] uppercase tracking-wide text-slate-400">Total estimé</div>
          <div id="supplies-total" class="text-2xl font-extrabold text-brand-cyan">0,00 €</div>
          <div id="supplies-remaining" class="text-[11px] text-slate-400">0 article à acheter</div>
        </div>
      </div>

      <div class="glass-panel border border-dark-border p-6 rounded-3xl space-y-4 card-glow">
        <h3 class="font-bold text-xl text-white flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-brand-cyan"></i> Ma liste d'achats</h3>
        <form onsubmit="addSupplyItem(event)" class="flex flex-wrap gap-2">
          <input type="text" id="supply-input" placeholder="Nouvelle fourniture..." class="flex-1 min-w-[160px] bg-[#0a0e17] border border-dark-border text-white rounded-xl p-3 text-xs focus:outline-none" required>
          <input type="number" id="supply-price-input" placeholder="Prix € (facultatif)" min="0" step="0.01" class="w-36 bg-[#0a0e17] border border-dark-border text-white rounded-xl p-3 text-xs focus:outline-none">
          <input type="url" id="supply-link-input" placeholder="Lien de l'article (facultatif)" class="flex-1 min-w-[160px] bg-[#0a0e17] border border-dark-border text-white rounded-xl p-3 text-xs focus:outline-none">
          <button type="submit" class="shrink-0 bg-brand-cyan text-slate-900 px-5 py-3 rounded-xl text-xs font-bold">Ajouter</button>
        </form>
        <ul id="supplies-list" class="space-y-2.5 max-h-[60vh] overflow-y-auto custom-scrollbar"></ul>
        <p id="supplies-empty" class="hidden text-center text-slate-500 text-xs py-6">Aucune fourniture pour le moment. Ajoutez votre premier article ci-dessus.</p>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="tampons.js" defer></script>
  <script>
    let state = BenkyoStorage.load();
    BenkyoStorage.autoFlushOn(state);

    function saveState() { BenkyoStorage.saveDebounced(state); }

    function updateProfileUI() {
      const sidebarImg = document.getElementById('sidebar-profile-img');
      if (sidebarImg) sidebarImg.src = state.profile.img;
    }

    function checkStreak() {
      const streakEl = document.getElementById('streak-count');
      if (streakEl) streakEl.innerText = state.streak.count;
    }

    // La liste est la même que celle de l'onglet « Grandes vacances » :
    // ce qui est ajouté ici s'y retrouve, et inversement.
    function ensureSupplies() {
      if (!state.vacation) state.vacation = BenkyoStorage.defaultState().vacation;
      if (!Array.isArray(state.vacation.supplies)) state.vacation.supplies = [];
      return state.vacation.supplies;
    }

    function renderSupplies() {
      const supplies = ensureSupplies();
      const list = document.getElementById('supplies-list');
      const empty = document.getElementById('supplies-empty');

      list.innerHTML = supplies.map((item, idx) => `
        <li class="flex flex-wrap justify-between items-center gap-2 bg-[#0a0e17] p-3 rounded-xl text-xs border border-dark-border">
          <div class="flex items-center space-x-2 min-w-0">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="toggleSupply(${idx})" class="rounded text-brand-cyan shrink-0">
            <span class="${item.done ? 'line-through text-slate-500' : 'text-slate-200'} break-words">${item.text}</span>
            ${item.price ? `<span class="shrink-0 text-brand-cyan bg-brand-cyan/10 border border-brand-cyan/30 px-2 py-0.5 rounded-full font-bold">${Number(item.price).toFixed(2)} €</span>` : ''}
            ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="shrink-0 text-slate-400 hover:text-brand-cyan" title="Voir l'article"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
          </div>
          <button onclick="deleteSupply(${idx})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
        </li>
      `).join('');

      if (empty) empty.classList.toggle('hidden', supplies.length > 0);

      const total = supplies.reduce((sum, i) => sum + (Number(i.price) || 0), 0);
      const todo = supplies.filter(i => !i.done).length;
      const totalEl = document.getElementById('supplies-total');
      const remainingEl = document.getElementById('supplies-remaining');
      if (totalEl) totalEl.innerText = total.toFixed(2).replace('.', ',') + ' €';
      if (remainingEl) remainingEl.innerText = todo + (todo > 1 ? ' articles à acheter' : ' article à acheter');
    }

    function toggleSupply(idx) {
      const supplies = ensureSupplies();
      if (!supplies[idx]) return;
      supplies[idx].done = !supplies[idx].done;
      saveState();
      renderSupplies();
    }

    function deleteSupply(idx) {
      ensureSupplies().splice(idx, 1);
      saveState();
      renderSupplies();
    }

    function addSupplyItem(e) {
      e.preventDefault();
      const input = document.getElementById('supply-input');
      const priceInput = document.getElementById('supply-price-input');
      const linkInput = document.getElementById('supply-link-input');
      const price = priceInput.value !== '' ? parseFloat(priceInput.value) : null;
      const link = linkInput.value.trim() || null;
      ensureSupplies().push({ text: input.value, done: false, price: price, link: link });
      input.value = '';
      priceInput.value = '';
      linkInput.value = '';
      saveState();
      renderSupplies();
    }

    function benkyoInitPage() {
      try { updateProfileUI(); } catch (e) {}
      try { checkStreak(); } catch (e) {}
      try { renderSupplies(); } catch (e) {}
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', benkyoInitPage);
    } else {
      benkyoInitPage();
    }
  </script>
</body>
</html>
