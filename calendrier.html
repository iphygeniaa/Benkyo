    <section id="tab-calendar" class="tab-content pg-shell">
      <header class="pg-card cal-top">

          <button onclick="changeMonth(-1)" class="pg-icon-btn" aria-label="Mois précédent"><svg class="pg-ico"><use href="#pi-left"/></svg></button>

  <!-- Modal d'ajout / Édition d'événement -->
  <div id="event-modal" class="hidden pg-modal">
    <div class="pg-sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title" class="pg-title">Événement de Calendrier</h3>
      <form onsubmit="saveCalendarEvent(event)">
        <input type="hidden" id="cal-id" value="">
        <div class="pg-field"><label class="pg-label" for="cal-title">Titre de l'événement</label>
          <input type="text" id="cal-title" class="pg-input" required></div>
        <div class="pg-field pg-row">
          <div><label class="pg-label" for="cal-date">Date</label><input type="date" id="cal-date" class="pg-input" required></div>
          <div><label class="pg-label" for="cal-time">Heure <span style="font-weight:600;opacity:.7">(facultatif)</span></label><input type="time" id="cal-time" class="pg-input"></div>

        <div class="pg-field"><label class="pg-label">Couleur de l'événement</label>

          <input type="hidden" id="cal-color" value="#cba6f7"></div>

          <select id="cal-repeat" class="pg-select">
            <option value="none">Événement unique 📌</option>
            <option value="daily">Répétitif : Par jour 🔄</option>
            <option value="weekly">Répétitif : Par semaine 🔄</option>

            <option value="yearly">Répétitif : Par an 🔄</option>
          </select></div>

          <!-- Bouton de suppression (uniquement visible lors de l'édition) -->
          <button type="button" id="btn-delete-event" onclick="deleteCalendarEvent()" class="hidden pg-btn danger"><svg class="pg-ico"><use href="#pi-trash"/></svg>Supprimer</button>
          <div class="grow">
            <button type="button" onclick="closeEventModal()" class="pg-btn">Annuler</button>

  <!-- Modale de confirmation générique (remplace confirm()) -->
  <div id="generic-confirm-modal" class="hidden pg-modal">
    <div class="pg-sheet pg-confirm" role="alertdialog" aria-modal="true" aria-labelledby="generic-confirm-title">
      <div class="pg-seal" lang="ja">注意</div>
      <h3 id="generic-confirm-title" class="pg-title">Confirmer la suppression</h3>
      <p id="generic-confirm-message">Cette action est définitive et ne peut pas être annulée.</p>
      <div class="pg-actions">
        <button onclick="closeGenericConfirmModal()" class="pg-btn">Annuler</button>
        <button id="generic-confirm-btn" onclick="executeGenericConfirm()" class="pg-btn danger-fill">Supprimer</button>
      </div>
    </div>

  <script src="app.js"></script>
  <script src="tampons.js" defer></script>
  <script>
    // Chargement de l'état
    let state = {};
    try {
      if (typeof BenkyoStorage !== 'undefined') {
        state = BenkyoStorage.load() || {};
        if (BenkyoStorage.autoFlushOn) BenkyoStorage.autoFlushOn(state);
      }
    } catch(err) {
      console.warn("Storage non disponible, utilisation du mode secours", err);
    }

    if (!state.events) state.events = [];
    if (!state.streak) state.streak = { count: 0, lastLogin: '' };

    let currentCalendarDate = new Date();

    function saveState() {
      try {
        if (typeof BenkyoStorage !== 'undefined' && BenkyoStorage.saveDebounced) {
          BenkyoStorage.saveDebounced(state);
        } else {
          localStorage.setItem('benkyo_state', JSON.stringify(state));
        }
      } catch(e){}
    }

    // -------- Modale de confirmation générique (remplace confirm()) --------
    let _genericConfirmCallback = null;
    function showConfirmModal(title, message, onConfirm, confirmLabel) {
      document.getElementById('generic-confirm-title').innerText = title || 'Confirmer la suppression';
      document.getElementById('generic-confirm-message').innerText = message || 'Cette action est définitive et ne peut pas être annulée.';
      document.getElementById('generic-confirm-btn').innerText = confirmLabel || 'Supprimer';
      _genericConfirmCallback = onConfirm;
      document.getElementById('generic-confirm-modal').classList.remove('hidden');
    }
    function closeGenericConfirmModal() {
      document.getElementById('generic-confirm-modal').classList.add('hidden');
      _genericConfirmCallback = null;
    }
    function executeGenericConfirm() {
      const cb = _genericConfirmCallback;
      closeGenericConfirmModal();
      if (cb) cb();
    }

    function updateProfileUI() {
      const sidebarImg = document.getElementById('sidebar-profile-img');
      if (sidebarImg && state.profile && state.profile.img) {
        sidebarImg.src = state.profile.img;
      }
    }

    function checkStreak() {
      const today = new Date().toDateString();
      if (state.streak.lastLogin !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (state.streak.lastLogin === yesterday.toDateString()) {
          state.streak.count++;
        } else {
          state.streak.count = 1;
        }
        state.streak.lastLogin = today;
        saveState();
      }
      const streakElem = document.getElementById('streak-count');
      if (streakElem) streakElem.innerText = state.streak.count || 0;
    }

    // ---- Couleurs d'événement ----
    // Palette pastel (teintes douces, cohérentes avec le design de l'app)
    const EVENT_COLORS = [
      { name: 'Lavande', value: '#cba6f7' },
      { name: 'Bleu ciel', value: '#a5c8fa' },
      { name: 'Menthe', value: '#94e2d5' },
      { name: 'Vert tendre', value: '#a6e3a1' },
      { name: 'Vanille', value: '#f9e2af' },
      { name: 'Pêche', value: '#f8bd96' },
      { name: 'Corail', value: '#f5a3a3' },
      { name: 'Rose poudré', value: '#f5c2e7' }
    ];

    function renderColorPicker(selected) {
      const box = document.getElementById('cal-color-picker');
      const hidden = document.getElementById('cal-color');
      if (!box || !hidden) return;
      const current = selected || '#cba6f7';
      hidden.value = current;
      box.innerHTML = EVENT_COLORS.map(c => `
        <button type="button" onclick="selectEventColor('${c.value}')" title="${c.name}" aria-label="${c.name}" aria-pressed="${c.value === current}"
          data-color="${c.value}" class="cal-color${c.value === current ? ' sel' : ''}" style="background:${c.value}"></button>
      `).join('');
    }

    function selectEventColor(value) {
      renderColorPicker(value);
    }

    function eventColor(evt) {
      return (evt && evt.color) ? evt.color : '#cba6f7';
    }

    // Modal : Réinitialisation pour création
    function openEventModal(presetDate) { 
      document.getElementById('modal-title').innerText = "Créer un Événement";
      document.getElementById('cal-id').value = "";
      document.getElementById('cal-title').value = "";
      document.getElementById('cal-date').value = presetDate || "";
      document.getElementById('cal-repeat').value = "none";
      document.getElementById('cal-time').value = "";
      renderColorPicker('#cba6f7');
      document.getElementById('btn-save-event').innerText = "Créer";
      document.getElementById('btn-delete-event').classList.add('hidden');

      document.getElementById('event-modal').classList.remove('hidden'); 
    }

    // ---- Modale « journée » ----
    function pad2(n) { return String(n).padStart(2, '0'); }

    function openDayModal(year, month, day) {
      const iso = `${year}-${pad2(month + 1)}-${pad2(day)}`;
      const dayEvents = (state.events || []).filter(e => isEventOnDate(e, year, month, day));

      // Journée vide → directement le formulaire de création
      if (dayEvents.length === 0) {
        openEventModal(iso);
        return;
      }

      const label = new Date(year, month, day).toLocaleDateString('fr-FR', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      document.getElementById('day-modal-title').innerText = label.charAt(0).toUpperCase() + label.slice(1);

      document.getElementById('day-modal-list').innerHTML = dayEvents.slice().sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99')).map(evt => `
        <button type="button" onclick="closeDayModal(); editEventModal(${evt.id})" style="--c:${eventColor(evt)}" class="cal-ditem">
          <span>${evt.time ? `<span class="t">${evt.time}</span>` : ''}${calEsc(evt.title)}</span>
          <svg class="pg-ico"><use href="#pi-pencil"/></svg>
        </button>
      `).join('');

      document.getElementById('day-modal-add').onclick = function () {
        closeDayModal();
        openEventModal(iso);
      };
      document.getElementById('day-modal').classList.remove('hidden');
    }

    function closeDayModal() {
      document.getElementById('day-modal').classList.add('hidden');
    }

    // Modal : Édition d'un événement existant
    function editEventModal(eventId) {
      const evt = state.events.find(e => e.id === eventId);
      if (!evt) return;

      document.getElementById('modal-title').innerText = "Modifier l'Événement";
      document.getElementById('cal-id').value = evt.id;
      document.getElementById('cal-title').value = evt.title;
      document.getElementById('cal-date').value = evt.date;
      document.getElementById('cal-repeat').value = evt.repeat || 'none';
      document.getElementById('cal-time').value = evt.time || "";
      renderColorPicker(eventColor(evt));
      document.getElementById('btn-save-event').innerText = "Enregistrer";
      document.getElementById('btn-delete-event').classList.remove('hidden');

      document.getElementById('event-modal').classList.remove('hidden');
    }
    
    function closeEventModal() { 
      document.getElementById('event-modal').classList.add('hidden'); 
    }

    // Création OU Édition d'un événement
    function saveCalendarEvent(e) {
      e.preventDefault();
      
      const idVal = document.getElementById('cal-id').value;
      const titleVal = document.getElementById('cal-title').value.trim();
      const dateVal = document.getElementById('cal-date').value;
      const repeatVal = document.getElementById('cal-repeat').value;
      const timeVal = document.getElementById('cal-time').value || '';
      const colorVal = document.getElementById('cal-color').value || '#cba6f7';

      if (!titleVal || !dateVal) return;

      if (idVal) {
        // Mode Édition
        const evtIndex = state.events.findIndex(e => e.id == idVal);
        if (evtIndex !== -1) {
          state.events[evtIndex].title = titleVal;
          state.events[evtIndex].date = dateVal;
          state.events[evtIndex].repeat = repeatVal;
          state.events[evtIndex].time = timeVal;
          state.events[evtIndex].color = colorVal;
        }
      } else {
        // Mode Création
        const newEvent = {
          id: Date.now(),
          title: titleVal,
          date: dateVal,
          repeat: repeatVal,
          time: timeVal,
          color: colorVal
        };
        state.events.push(newEvent);
      }

      saveState();
      closeEventModal();
      renderCalendar();
    }

    // Supprimer l'événement courant
    function deleteCalendarEvent() {
      const idVal = document.getElementById('cal-id').value;
      if (!idVal) return;

      const evt = state.events.find(e => e.id == idVal);
      showConfirmModal(
        'Supprimer cet événement ?',
        evt ? `L'événement « ${evt.title} » sera définitivement supprimé du calendrier.` : 'Cette action est définitive et ne peut pas être annulée.',
        () => {
          state.events = state.events.filter(e => e.id != idVal);
          saveState();
          closeEventModal();
          renderCalendar();
        }
      );
    }

    // Navigation des mois
    function changeMonth(delta) {
      currentCalendarDate = new Date(currentCalendarDate.getFullYear(), currentCalendarDate.getMonth() + delta, 1);
      renderCalendar();
    }

    // Changement d'année via le dropdown
    function changeYear(newYear) {
      currentCalendarDate.setFullYear(parseInt(newYear, 10));
      renderCalendar();
    }

    // Vérification de la date de l'événement
    function isEventOnDate(event, year, month, day) {
      if (!event || !event.date) return false;

      const parts = event.date.split('-');
      if (parts.length !== 3) return false;
      
      const eventYear = parseInt(parts[0], 10);
      const eventMonth = parseInt(parts[1], 10) - 1; 
      const eventDay = parseInt(parts[2], 10);

      const eventDate = new Date(eventYear, eventMonth, eventDay);
      const targetDate = new Date(year, month, day);

      if (isNaN(eventDate.getTime())) return false;

      if (event.repeat === 'none') {
        return eventYear === year && eventMonth === month && eventDay === day;
      } else if (event.repeat === 'daily') {
        return targetDate >= eventDate;
      } else if (event.repeat === 'weekly') {
        return targetDate >= eventDate && targetDate.getDay() === eventDate.getDay();
      } else if (event.repeat === 'monthly') {
        return targetDate >= eventDate && targetDate.getDate() === eventDay;
      } else if (event.repeat === 'yearly') {
        return targetDate >= eventDate && targetDate.getDate() === eventDay && targetDate.getMonth() === eventMonth;
      }
      return false;
    }

    // Noms modernes japonais des mois (numéro + 月), tels qu'utilisés
    // aujourd'hui dans les calendriers japonais courants.
    // Index 0 = janvier ... 11 = décembre.
    const JAPANESE_MONTH_NAMES = [
      { kanji: '1月', romaji: 'Ichigatsu' },
      { kanji: '2月', romaji: 'Nigatsu' },
      { kanji: '3月', romaji: 'Sangatsu' },
      { kanji: '4月', romaji: 'Shigatsu' },
      { kanji: '5月', romaji: 'Gogatsu' },
      { kanji: '6月', romaji: 'Rokugatsu' },
      { kanji: '7月', romaji: 'Shichigatsu' },
      { kanji: '8月', romaji: 'Hachigatsu' },
      { kanji: '9月', romaji: 'Kugatsu' },
      { kanji: '10月', romaji: 'Jugatsu' },
      { kanji: '11月', romaji: 'Juichigatsu' },
      { kanji: '12月', romaji: 'Junigatsu' }
    ];

    function calEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    // Kanji de la saison (même découpage que l'accueil : printemps mars-mai, etc.)
    const SEASON_KANJI = ['冬', '冬', '春', '春', '春', '夏', '夏', '夏', '秋', '秋', '秋', '冬'];

    function goToday() {
      const n = new Date();
      currentCalendarDate = new Date(n.getFullYear(), n.getMonth(), 1);
      renderCalendar();
    }

    function openDayFromKey(e, year, month, day) {
      if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();
      openDayModal(year, month, day);
    }

    function renderCalendar() {
      const monthTitle = document.getElementById('calendar-month-title');
      const yearSelect = document.getElementById('calendar-year-select');
      const daysContainer = document.getElementById('calendar-days');
      if (!daysContainer || !monthTitle || !yearSelect) return;

      const year = currentCalendarDate.getFullYear();
      const month = currentCalendarDate.getMonth();

      // Nom du mois (l'année est dans le sélecteur)
      const formattedMonth = currentCalendarDate.toLocaleDateString('fr-FR', { month: 'long' });
      monthTitle.innerText = formattedMonth.charAt(0).toUpperCase() + formattedMonth.slice(1);
      const jpMonth = JAPANESE_MONTH_NAMES[month];
      const monthTitleJp = document.getElementById('calendar-month-title-jp');
      if (monthTitleJp && jpMonth) monthTitleJp.innerText = `${jpMonth.kanji} · ${jpMonth.romaji}`;
      const kj = document.getElementById('calendar-kanji');
      if (kj) kj.textContent = SEASON_KANJI[month];

      // Liste des années dans le sélecteur (-5 ans à +10 ans)
      yearSelect.innerHTML = '';
      for (let y = year - 5; y <= year + 10; y++) {
        const option = document.createElement('option');
        option.value = y;
        option.innerText = y;
        if (y === year) option.selected = true;
        yearSelect.appendChild(option);
      }

      // Index du premier jour du mois (Lundi = 0, ..., Dimanche = 6)
      let firstDayIndex = new Date(year, month, 1).getDay();
      firstDayIndex = (firstDayIndex === 0) ? 6 : firstDayIndex - 1;

      const totalDays = new Date(year, month + 1, 0).getDate();
      const today = new Date();
      const MAX_CHIPS = 3;
      const monthOccurrences = [];
      let html = '';

      for (let i = 0; i < firstDayIndex; i++) html += '<div class="cal-day empty" aria-hidden="true"></div>';

      for (let day = 1; day <= totalDays; day++) {
        const isToday = today.getDate() === day && today.getMonth() === month && today.getFullYear() === year;
        const col = (firstDayIndex + day - 1) % 7;
        const dayEvents = state.events
          .filter(e => isEventOnDate(e, year, month, day))
          .sort((a, b) => (a.time || '99:99').localeCompare(b.time || '99:99'));
        dayEvents.forEach(evt => monthOccurrences.push({ day, evt }));

        const chips = dayEvents.slice(0, MAX_CHIPS).map(evt => `
          <button type="button" onclick="event.stopPropagation(); editEventModal(${evt.id})" style="--c:${eventColor(evt)}" class="cal-evt" title="${calEsc(evt.title)} — cliquer pour modifier">${evt.time ? `<span class="t">${evt.time}</span>` : ''}${calEsc(evt.title)}</button>
        `).join('');
        const more = dayEvents.length > MAX_CHIPS ? `<span class="cal-more">+ ${dayEvents.length - MAX_CHIPS} autre${dayEvents.length - MAX_CHIPS > 1 ? 's' : ''}</span>` : '';
        const dots = dayEvents.map(evt => `<i style="--c:${eventColor(evt)}"></i>`).join('');
        const label = new Date(year, month, day).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) +
          (dayEvents.length ? `, ${dayEvents.length} événement${dayEvents.length > 1 ? 's' : ''}` : '');

        html += `
          <div role="button" tabindex="0" aria-label="${label}" onclick="openDayModal(${year}, ${month}, ${day})" onkeydown="openDayFromKey(event, ${year}, ${month}, ${day})"
               class="cal-day${isToday ? ' today' : ''}${col >= 5 ? ' weekend' : ''}">
            <span class="cal-num">${day}</span>
            <div class="cal-evts">${chips}</div>${more}
            <div class="cal-dots">${dots}</div>
          </div>`;
      }

      daysContainer.innerHTML = html;

      // Panneau « Ce mois-ci »
      const list = document.getElementById('cal-month-list');
      const sideTitle = document.getElementById('cal-side-title');
      if (list) {
        if (sideTitle) sideTitle.textContent = 'Ce mois-ci';
        list.innerHTML = monthOccurrences.length ? monthOccurrences.map(({ day, evt }) => {
          const d = new Date(year, month, day);
          const dow = d.toLocaleDateString('fr-FR', { weekday: 'short' }).replace('.', '');
          const rep = { daily: 'chaque jour', weekly: 'chaque semaine', monthly: 'chaque mois', yearly: 'chaque année' }[evt.repeat];
          const sub = [evt.time, rep].filter(Boolean).join(' · ');
          return `<li><button type="button" style="--c:${eventColor(evt)}" onclick="editEventModal(${evt.id})">
            <span class="dnum"><b>${day}</b><small>${dow}</small></span>
            <span class="txt"><b>${calEsc(evt.title)}</b>${sub ? `<small>${calEsc(sub)}</small>` : ''}</span>
            <span class="bar"></span></button></li>`;
        }).join('') : '<li class="cal-empty">Rien de prévu ce mois-ci. Touche un jour pour ajouter un événement.</li>';
      }
    }

    function saveNoteContent(idx) {
      const el = document.getElementById(`note-body-${idx}`);
      if (el && state.notes && state.notes[idx]) { 
        state.notes[idx].content = el.innerHTML; 
        saveState(); 
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      updateProfileUI();
      checkStreak();
      renderCalendar();
    });
  </script>
  <script src="menu-nav.js"></script>
</body>
</html>
