    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; }
    .card-back { transform: rotateY(180deg); }

    .tab-content { transition: opacity 0.2s ease-in-out; }

    .tab-content:not(.hidden) { opacity: 1; }

    }
    .welcome-overlay { animation: welcomeFade 3s forwards ease-in-out; }

  <script>
    let state = BenkyoStorage.load();
    BenkyoStorage.autoFlushOn(state);

    let copiedTimetableItem = null;
    let selectedLatinStars = 0;
    let editLatinStarsCount = 0;
    let lofiAudio = null;
    let statsChartInstance = null;

    // Sauvegarde optimisée avec debounce
    function saveState() {
      BenkyoStorage.saveDebounced(state);
    }

    function updateProfileUI() {
      const sidebarImg = document.getElementById('sidebar-profile-img');
      if(sidebarImg) sidebarImg.src = state.profile.img;
    }

    // Sous-onglets présentés comme dans le Pomodoro : une simple barre
    // d'onglets cliquables, avec soulignement de l'onglet actif.
    function switchVacationSubTab(subId) {
      document.querySelectorAll('.vacation-sub-content').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(`sub-tab-${subId}`);
      if (target) target.classList.remove('hidden');
      document.querySelectorAll('#vacation-subtabs .subtab-btn').forEach(btn => {
        const active = btn.dataset.sub === subId;
        btn.classList.toggle('is-active-emerald', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      try { sessionStorage.setItem('benkyoVacationSubTab', subId); } catch (e) {}
    }

    function checkStreak() {
      const today = new Date().toDateString();
      if (state.streak.lastLogin !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (state.streak.lastLogin === yesterday.toDateString()) state.streak.count++;
        else state.streak.count = 1;
        state.streak.lastLogin = today;
        saveState();
      }
      const streakEl = document.getElementById('streak-count');
      if(streakEl) streakEl.innerText = state.streak.count;
    }

    function saveNoteContent(idx) {
      const el = document.getElementById(`note-body-${idx}`);
      if(el) { 
        state.notes[idx].content = el.innerHTML; 
        saveState(); 
      }
    }

    function renderVacation() {
      const supList = document.getElementById('supplies-list');
      supList.innerHTML = state.vacation.supplies.map((item, idx) => `
        <li class="flex flex-wrap justify-between items-center gap-2 bg-[#0a0e17] p-3 rounded-xl text-xs border border-dark-border">
          <div class="flex items-center space-x-2 min-w-0">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="state.vacation.supplies[${idx}].done=!state.vacation.supplies[${idx}].done; saveState(); renderVacation();" class="rounded text-brand-cyan shrink-0">
            <span class="${item.done ? 'line-through text-slate-500' : 'text-slate-200'} break-words">${item.text}</span>
            ${item.price ? `<span class="shrink-0 text-brand-cyan bg-brand-cyan/10 border border-brand-cyan/30 px-2 py-0.5 rounded-full font-bold">${Number(item.price).toFixed(2)} €</span>` : ''}
            ${item.link ? `<a href="${item.link}" target="_blank" rel="noopener noreferrer" class="shrink-0 text-slate-400 hover:text-brand-cyan" title="Voir l'article"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>` : ''}
          </div>
          <button onclick="state.vacation.supplies.splice(${idx},1); saveState(); renderVacation();" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
        </li>
      `).join('');

      const bookList = document.getElementById('summer-books-list');
      bookList.innerHTML = state.vacation.books.map((raw, idx) => {
        const b = normalizeBook(raw);
        const percent = bookProgressPercent(b);
        const todayIso = new Date().toISOString().slice(0, 10);
        const todayEntry = (b.history || []).find(h => h.date === todayIso);
        const remaining = b.totalPages ? Math.max(0, b.totalPages - b.pagesRead) : 0;
        const recent = (b.history || []).slice(-5).reverse();

        // Le suivi détaillé (pages + barre de progression) ne s'affiche que
        // pour les lectures "en cours" : c'est là qu'il est utile au quotidien.
        const tracker = b.status === 'en cours' ? `
          <div class="space-y-2 pt-1">
            <div class="flex flex-wrap items-end gap-2">
              <label class="flex flex-col gap-1">
                <span class="text-[10px] uppercase tracking-wide text-slate-400">Pages lues</span>
                <input type="number" min="0" ${b.totalPages ? `max="${b.totalPages}"` : ''} value="${b.pagesRead}"
                  onchange="setBookPagesRead(${idx}, this.value)"
                  class="w-24 bg-slate-800 text-white rounded-lg p-2 text-xs border border-dark-border focus:outline-none">
              </label>
              <span class="pb-2 text-slate-500">/</span>
              <label class="flex flex-col gap-1">
                <span class="text-[10px] uppercase tracking-wide text-slate-400">Pages au total</span>
                <input type="number" min="0" value="${b.totalPages || ''}" placeholder="ex : 320"
                  onchange="setBookTotalPages(${idx}, this.value)"
                  class="w-28 bg-slate-800 text-white rounded-lg p-2 text-xs border border-dark-border focus:outline-none">
              </label>
              <div class="flex gap-1.5 pb-0.5">
                <button type="button" onclick="addBookPages(${idx}, 5)" class="bg-brand-purple/20 text-brand-purple border border-brand-purple/40 px-2.5 py-2 rounded-lg font-bold">+5</button>
                <button type="button" onclick="addBookPages(${idx}, 10)" class="bg-brand-purple/20 text-brand-purple border border-brand-purple/40 px-2.5 py-2 rounded-lg font-bold">+10</button>
                <button type="button" onclick="addBookPages(${idx}, 25)" class="bg-brand-purple/20 text-brand-purple border border-brand-purple/40 px-2.5 py-2 rounded-lg font-bold">+25</button>
              </div>
            </div>

            <div class="read-progress-track">
              <div class="read-progress-fill" style="width:${percent}%"></div>
            </div>
            <div class="flex flex-wrap justify-between gap-2 text-[11px] text-slate-400">
              <span><strong class="text-white">${percent}%</strong> lu${b.totalPages ? ` — ${b.pagesRead} / ${b.totalPages} pages` : ' (indiquez le nombre total de pages)'}</span>
              ${b.totalPages ? `<span>${remaining} page${remaining > 1 ? 's' : ''} restante${remaining > 1 ? 's' : ''}</span>` : ''}
            </div>
            <div class="text-[11px] text-slate-400">
              ${todayEntry ? `Aujourd'hui : <strong class="text-emerald-400">+${todayEntry.pages} pages</strong>` : "Aujourd'hui : pas encore de pages enregistrées"}
            </div>
            ${recent.length ? `
              <div class="flex flex-wrap gap-1.5 pt-1">
                ${recent.map(h => `<span class="bg-slate-800 border border-dark-border rounded-full px-2 py-0.5 text-[10px] text-slate-300">${formatBookDate(h.date)} · ${h.pages > 0 ? '+' : ''}${h.pages} p.</span>`).join('')}
              </div>` : ''}
          </div>` : '';

        const doneBadge = b.status === 'lu' && b.totalPages
          ? `<div class="text-[11px] text-emerald-400">Terminé — ${b.totalPages} pages lues 🎉</div>` : '';

        return `
        <li class="bg-[#0a0e17] p-3 rounded-2xl text-xs border border-dark-border space-y-2">
          <div class="flex justify-between font-bold text-white">
            <span>${b.title}</span>
            <button onclick="state.vacation.books.splice(${idx},1); saveState(); renderVacation();" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
          </div>
          <select onchange="state.vacation.books[${idx}].status=this.value; saveState(); renderVacation();" class="w-full bg-slate-800 text-slate-200 p-2 rounded-lg">
            <option value="à lire" ${b.status==='à lire'?'selected':''}>À lire 🔴</option>
            <option value="en cours" ${b.status==='en cours'?'selected':''}>En cours 🟡</option>
            <option value="lu" ${b.status==='lu'?'selected':''}>Lu 🟢</option>
          </select>
          ${tracker}
          ${doneBadge}
        </li>`;
      }).join('');

      const latinList = document.getElementById('latin-history-list');
      latinList.innerHTML = state.vacation.latin.map((l, idx) => `
        <div class="bg-[#0a0e17] p-3 rounded-xl text-xs flex justify-between items-center border border-dark-border">
          <div>
            <div class="font-bold text-amber-400 text-sm">${l.title}</div>
            <div class="text-[10px] text-slate-400">${l.date}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-amber-400 font-bold">${'★'.repeat(l.stars)}</div>
            <button onclick="openLatinEditModal(${idx})" class="text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded" title="Modifier"><i class="fa-solid fa-pen"></i></button>
            <button onclick="state.vacation.latin.splice(${idx},1); saveState(); renderVacation();" class="text-slate-500 hover:text-red-400 bg-slate-800 px-2 py-1 rounded" title="Supprimer"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function addSupplyItem(e) {
      e.preventDefault();
      const input = document.getElementById('supply-input');
      const priceInput = document.getElementById('supply-price-input');
      const linkInput = document.getElementById('supply-link-input');
      const price = priceInput.value !== '' ? parseFloat(priceInput.value) : null;
      const link = linkInput.value.trim() || null;
      state.vacation.supplies.push({ text: input.value, done: false, price: price, link: link });
      input.value = '';
      priceInput.value = '';
      linkInput.value = '';
      saveState();
      renderVacation();
    }

    function addSummerBook(e) {
      e.preventDefault();
      const title = document.getElementById('book-title-input').value;
      const status = document.getElementById('book-status-input').value;
      const totalInput = document.getElementById('book-pages-input');
      const totalPages = totalInput && totalInput.value !== '' ? Math.max(0, parseInt(totalInput.value, 10) || 0) : 0;
      state.vacation.books.push({ title, status, totalPages: totalPages, pagesRead: 0, history: [] });
      document.getElementById('book-title-input').value = '';
      if (totalInput) totalInput.value = '';
      saveState();
      renderVacation();
    }

    // ---- Suivi de lecture page par page (livres "en cours") -----------------
    // On normalise chaque livre : les livres enregistrés avant cette
    // fonctionnalité n'ont pas de champ pages, on les complète à la volée.
    function normalizeBook(b) {
      if (typeof b.totalPages !== 'number') b.totalPages = 0;
      if (typeof b.pagesRead !== 'number') b.pagesRead = 0;
      if (!Array.isArray(b.history)) b.history = [];
      if (b.status === 'lu' && b.totalPages > 0) b.pagesRead = b.totalPages;
      if (b.totalPages > 0 && b.pagesRead > b.totalPages) b.pagesRead = b.totalPages;
      if (b.pagesRead < 0) b.pagesRead = 0;
      return b;
    }

    function bookProgressPercent(b) {
      if (!b.totalPages) return b.status === 'lu' ? 100 : 0;
      return Math.min(100, Math.round((b.pagesRead / b.totalPages) * 100));
    }

    function setBookTotalPages(idx, value) {
      const b = state.vacation.books[idx];
      if (!b) return;
      b.totalPages = Math.max(0, parseInt(value, 10) || 0);
      if (b.totalPages && b.pagesRead > b.totalPages) b.pagesRead = b.totalPages;
      saveState();
      renderVacation();
    }

    // Mise à jour quotidienne : on enregistre le nombre de pages lues au total
    // et on garde une trace datée pour voir la progression jour après jour.
    function setBookPagesRead(idx, value) {
      const b = state.vacation.books[idx];
      if (!b) return;
      const previous = b.pagesRead || 0;
      let pages = Math.max(0, parseInt(value, 10) || 0);
      if (b.totalPages) pages = Math.min(pages, b.totalPages);
      b.pagesRead = pages;
      recordBookProgress(b, pages - previous);
      if (b.totalPages && pages >= b.totalPages) b.status = 'lu';
      else if (pages > 0) b.status = 'en cours';
      saveState();
      renderVacation();
    }

    function addBookPages(idx, delta) {
      const b = state.vacation.books[idx];
      if (!b) return;
      setBookPagesRead(idx, (b.pagesRead || 0) + delta);
    }

    function recordBookProgress(b, delta) {
      if (!delta) return;
      const today = new Date().toISOString().slice(0, 10);
      if (!Array.isArray(b.history)) b.history = [];
      const entry = b.history.find(h => h.date === today);
      if (entry) entry.pages += delta;
      else b.history.push({ date: today, pages: delta });
      b.history = b.history.filter(h => h.pages !== 0).slice(-60);
      b.lastUpdate = today;
    }

    function formatBookDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${d}/${m}`;
    }

    function setLatinStars(count) {
      selectedLatinStars = count;
      const stars = document.querySelectorAll('#latin-star-rating .star');
      stars.forEach((s, idx) => {
        if(idx < count) s.classList.add('text-amber-400');
        else s.classList.remove('text-amber-400');
      });
    }

    function addLatinEntry(e) {
      e.preventDefault();
      const title = document.getElementById('latin-title').value;
      if(!selectedLatinStars) return alert("Veuillez évaluer la difficulté en cliquant sur les étoiles.");
      state.vacation.latin.unshift({ title, stars: selectedLatinStars, date: new Date().toLocaleDateString('fr-FR') });
      document.getElementById('latin-title').value = '';
      selectedLatinStars = 0;
      setLatinStars(0);
      saveState();
      renderVacation();
    }

    function openLatinEditModal(idx) {
      const item = state.vacation.latin[idx];
      document.getElementById('latin-edit-index').value = idx;
      document.getElementById('latin-edit-title').value = item.title;
      editLatinStarsCount = item.stars;
      setEditLatinStars(editLatinStarsCount);
      document.getElementById('latin-edit-modal').classList.remove('hidden');
    }

    function closeLatinEditModal() {
      document.getElementById('latin-edit-modal').classList.add('hidden');
    }

    function setEditLatinStars(count) {
      editLatinStarsCount = count;
      const stars = document.querySelectorAll('#latin-edit-star-rating .edit-star');
      stars.forEach((s, idx) => {
        if(idx < count) s.classList.add('text-amber-400');
        else s.classList.remove('text-amber-400');
      });
    }

    function saveEditedLatin(e) {
      e.preventDefault();
      const idx = parseInt(document.getElementById('latin-edit-index').value);
      const newTitle = document.getElementById('latin-edit-title').value;
      if(state.vacation.latin[idx]) {
        state.vacation.latin[idx].title = newTitle;
        state.vacation.latin[idx].stars = editLatinStarsCount;
        saveState();
        renderVacation();
        closeLatinEditModal();
      }
    }

    function benkyoInitPage() {
      try { updateProfileUI(); } catch(e) {}
      try { checkStreak(); } catch(e) {}
      try { renderVacation(); } catch(e) {}
      // On rouvre le sous-onglet consulté juste avant (retour depuis une autre page).
      try {
        const saved = sessionStorage.getItem('benkyoVacationSubTab');
        switchVacationSubTab(saved || 'supplies');
      } catch(e) { switchVacationSubTab('supplies'); }
    }
    // DOMContentLoaded plutôt que window.onload : voir explication dans les
    // autres pages — "load" peut ne jamais se déclencher si une ressource
    // externe est lente/bloquée, laissant la page à moitié vide.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', benkyoInitPage);
    } else {
      benkyoInitPage();
    }
  </script>
</body>
</html>
