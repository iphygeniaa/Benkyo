<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Connexion — Benkyō</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <meta name="theme-color" content="#e9c9d3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script defer src="sakura.js"></script>
  <style>
    .login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .login-card { width: min(440px, 100%); border-radius: var(--radius-xl); padding: 32px 28px 28px; }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 6px; }
    .login-brand .logo { width: 44px; height: 44px; filter: drop-shadow(0 3px 5px rgba(143, 26, 31, .35)); }
    .login-brand span { font-family: var(--f-display); font-weight: 600; font-size: 1.5rem; letter-spacing: .08em; color: var(--ink); }
    .login-sub { text-align: center; margin: 0 0 22px; color: var(--ink-soft); font-size: .95rem; }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 16px; background: rgba(255,255,255,.45); margin-bottom: 20px; }
    .tabs button { border: 0; border-radius: 12px; padding: 10px 8px; font: 700 .9rem var(--f-body); color: var(--ink-soft); background: transparent; cursor: pointer; transition: background .2s, color .2s; }
    .tabs button[aria-selected="true"] { background: #fff; color: var(--rose); box-shadow: 0 4px 12px -6px rgba(92, 40, 62, .4); }

    form { display: grid; gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 700; font-size: .85rem; color: var(--ink); }
    .field { position: relative; }
    .field input { width: 100%; border: 1px solid rgba(200, 70, 125, .25); background: rgba(255,255,255,.85); border-radius: 14px; padding: 12px 14px; font: 600 1rem var(--f-body); color: var(--ink); }
    .field input::placeholder { color: var(--ink-faint); font-weight: 500; }
    .field input:focus { outline: 2px solid var(--rose); outline-offset: 1px; }
    .field.has-toggle input { padding-right: 64px; }
    .toggle-pw { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--rose); font: 700 .78rem var(--f-body); cursor: pointer; padding: 6px 8px; border-radius: 8px; }

    .primary { border: 0; border-radius: 14px; padding: 13px 16px; font: 800 1rem var(--f-body); color: #fff; background: linear-gradient(135deg, #e07aa5, var(--rose)); cursor: pointer; box-shadow: 0 10px 22px -10px rgba(200, 70, 125, .8); transition: transform .15s, opacity .2s; }
    .primary:hover { transform: translateY(-1px); }
    .primary[disabled] { opacity: .6; cursor: wait; transform: none; }
    .link-btn { border: 0; background: none; color: var(--rose); font: 700 .85rem var(--f-body); cursor: pointer; text-decoration: underline; padding: 4px; justify-self: center; }

    .msg { margin: 0; min-height: 1.2em; font-size: .88rem; font-weight: 600; text-align: center; }
    .msg.err { color: #b3261e; }
    .msg.ok { color: #1b7a4b; }
    .hint { margin: 2px 0 0; font-size: .78rem; font-weight: 500; color: var(--ink-faint); }
    [hidden] { display: none !important; }
  </style>
</head>
<body class="home">
  <div class="bg" aria-hidden="true"></div>

  <main class="login-shell">
    <section class="login-card glass" aria-labelledby="titre">
      <div class="login-brand">
        <svg class="logo" role="img" aria-label="Benkyō" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
          <g transform="rotate(-3 50 50)">
            <rect x="8" y="8" width="84" height="84" rx="10" fill="#c1272d"/>
            <rect x="14" y="14" width="72" height="72" rx="7" fill="none" stroke="#ffffff" stroke-width="1.4" opacity="0.85"/>
            <text x="50" y="41" text-anchor="middle" dominant-baseline="middle" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="33" fill="#ffffff" font-weight="700">勉</text>
            <text x="50" y="75" text-anchor="middle" dominant-baseline="middle" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif" font-size="33" fill="#ffffff" font-weight="700">強</text>
          </g>
        </svg>
        <span>BENKYO</span>
      </div>
      <h1 id="titre" style="position:absolute;left:-9999px">Connexion à Benkyō</h1>
      <p class="login-sub" id="sous-titre">Content de te revoir 🌸</p>

      <div class="tabs" role="tablist" aria-label="Choisir une action">
        <button type="button" role="tab" id="tab-login" aria-selected="true">Se connecter</button>
        <button type="button" role="tab" id="tab-signup" aria-selected="false">Créer un compte</button>
      </div>

      <!-- Connexion / création -->
      <form id="form-main" novalidate>
        <label>Adresse e-mail
          <span class="field"><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="toi@exemple.com" required></span>
        </label>
        <label>Mot de passe
          <span class="field has-toggle">
            <input id="password" type="password" autocomplete="current-password" placeholder="Ton mot de passe" required minlength="6">
            <button type="button" class="toggle-pw" id="toggle-pw" aria-label="Afficher ou masquer le mot de passe">Afficher</button>
          </span>
        </label>
        <label id="confirm-wrap" hidden>Confirme le mot de passe
          <span class="field"><input id="password2" type="password" autocomplete="new-password" placeholder="Retape le mot de passe"></span>
          <span class="hint">6 caractères minimum.</span>
        </label>
        <p class="msg" id="msg" role="alert" aria-live="polite"></p>
        <button type="submit" class="primary" id="submit">Se connecter</button>
        <button type="button" class="link-btn" id="forgot">Mot de passe oublié ?</button>
      </form>
    </section>
  </main>

  <script>
    (function () {
      var mode = 'login';
      var $ = function (id) { return document.getElementById(id); };
      var email = $('email'), pw = $('password'), pw2 = $('password2'), msg = $('msg'), submit = $('submit');

      function setMsg(text, kind) { msg.textContent = text || ''; msg.className = 'msg' + (kind ? ' ' + kind : ''); }

      function setMode(m) {
        mode = m;
        var signup = (m === 'signup');
        $('tab-login').setAttribute('aria-selected', String(!signup));
        $('tab-signup').setAttribute('aria-selected', String(signup));
        $('confirm-wrap').hidden = !signup;
        $('forgot').hidden = signup;
        submit.textContent = signup ? 'Créer mon compte' : 'Se connecter';
        pw.autocomplete = signup ? 'new-password' : 'current-password';
        $('sous-titre').textContent = signup ? 'Crée ton espace d\'études 🌸' : 'Content de te revoir 🌸';
        setMsg('');
      }
      $('tab-login').addEventListener('click', function () { setMode('login'); });
      $('tab-signup').addEventListener('click', function () { setMode('signup'); });

      $('toggle-pw').addEventListener('click', function () {
        var show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        pw2.type = show ? 'text' : 'password';
        this.textContent = show ? 'Masquer' : 'Afficher';
      });

      function busy(b) { submit.disabled = b; $('forgot').disabled = b; }

      $('form-main').addEventListener('submit', function (e) {
        e.preventDefault();
        setMsg('');
        var mail = email.value.trim();
        if (!mail) { setMsg('Écris ton adresse e-mail.', 'err'); email.focus(); return; }
        if (!pw.value) { setMsg('Écris ton mot de passe.', 'err'); pw.focus(); return; }
        if (mode === 'signup') {
          if (pw.value.length < 6) { setMsg('Mot de passe trop court : 6 caractères minimum.', 'err'); pw.focus(); return; }
          if (pw.value !== pw2.value) { setMsg('Les deux mots de passe ne sont pas identiques.', 'err'); pw2.focus(); return; }
        }
        busy(true);
        var action = (mode === 'signup') ? BenkyoAuth.signUp(mail, pw.value) : BenkyoAuth.signIn(mail, pw.value);
        action.then(function () {
          setMsg(mode === 'signup' ? 'Compte créé ! Redirection…' : 'Connexion réussie, redirection…', 'ok');
          // La redirection est faite automatiquement par auth.js
        }).catch(function (err) {
          busy(false);
          setMsg(BenkyoAuth.errorMessage(err), 'err');
        });
      });

      $('forgot').addEventListener('click', function () {
        var mail = email.value.trim();
        if (!mail) { setMsg('Écris d\'abord ton adresse e-mail ci-dessus, puis clique sur « Mot de passe oublié ».', 'err'); email.focus(); return; }
        busy(true);
        BenkyoAuth.resetPassword(mail).then(function () {
          busy(false);
          setMsg('Si un compte existe avec cette adresse, un e-mail de réinitialisation vient d\'être envoyé (pense à regarder les spams).', 'ok');
        }).catch(function (err) {
          busy(false);
          setMsg(BenkyoAuth.errorMessage(err), 'err');
        });
      });
    })();
  </script>
</body>
</html>
