  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0a0e17; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f293d; border-radius: 4px; }
    
    /* Optimisation GPU : Remplacement du backdrop-blur lourd par un fond solide avec opacité */
    .glass-panel { 
      background: rgba(15, 20, 32, 0.95); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.25);
    }
    .card-glow { transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease; }
    .card-glow:hover { border-color: rgba(232, 142, 178, 0.4); box-shadow: 0 0 15px -3px rgba(232, 142, 178, 0.2); transform: translateY(-1px); }
    
    .card-flip { perspective: 1000px; }
    .card-inner { transition: transform 0.4s; transform-style: preserve-3d; }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; }
    .card-back { transform: rotateY(180deg); }

    .tab-content { transition: opacity 0.15s ease-in-out; }
    .tab-content.hidden { display: none; opacity: 0; }
    .tab-content:not(.hidden) { opacity: 1; }

    @keyframes welcomeFade {
      0% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1.01); }
      100% { opacity: 0; transform: scale(0.98); visibility: hidden; }
    }
    .welcome-overlay { animation: welcomeFade 2.5s forwards ease-in-out; }

    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(12px); } }
    #app-toast.toast-show { display: flex; animation: toastIn 0.25s ease-out forwards; }
    #app-toast.toast-hide { animation: toastOut 0.25s ease-in forwards; }
  </style>
  <link rel="stylesheet" href="style.css">

  <script src="app.js"></script>

  <script>
    let state = BenkyoStorage.load();
    BenkyoStorage.autoFlushOn(state);

    let copiedTimetableItem = null;
    let selectedLatinStars = 0;
    let editLatinStarsCount = 0;
    let lofiAudio = null;
    let statsChartInstance = null;

    function saveState() {
      BenkyoStorage.save(state);
    }

    // Toast de confirmation stylé (remplace les alert() intrusifs)
    let toastTimer = null;
    function showToast(message, type) {
      const toast = document.getElementById('app-toast');
      if (!toast) { return; }
      const iconWrap = document.getElementById('app-toast-icon-wrap');
      const icon = document.getElementById('app-toast-icon');
      document.getElementById('app-toast-message').innerText = message;
      if (type === 'warning') {
        toast.className = 'glass-panel border border-amber-500/30 rounded-2xl px-5 py-4 flex items-center gap-3 shadow-2xl shadow-amber-500/10 max-w-sm';
        iconWrap.className = 'w-9 h-9 shrink-0 rounded-full bg-amber-500/20 flex items-center justify-center';
        icon.className = 'fa-solid fa-triangle-exclamation text-amber-400';
      } else {
        toast.className = 'glass-panel border border-emerald-500/30 rounded-2xl px-5 py-4 flex items-center gap-3 shadow-2xl shadow-emerald-500/10 max-w-sm';
        iconWrap.className = 'w-9 h-9 shrink-0 rounded-full bg-emerald-500/20 flex items-center justify-center';
        icon.className = 'fa-solid fa-check text-emerald-400';
      }
      clearTimeout(toastTimer);
      toast.classList.remove('hidden', 'toast-hide');
      toast.classList.add('fixed', 'bottom-6', 'right-6', 'z-[80]', 'toast-show');
      toastTimer = setTimeout(() => {
        toast.classList.remove('toast-show');
        toast.classList.add('toast-hide');
        setTimeout(() => toast.classList.add('hidden'), 250);
      }, 2600);
    }

    // -------- Modale de confirmation générique (remplace confirm()) --------
    let _genericConfirmCallback = null;
    function showConfirmModal(title, message, onConfirm, confirmLabel) {
      document.getElementById('generic-confirm-title').innerText = title || 'Confirmer la suppression';
      document.getElementById('generic-confirm-message').innerText = message || 'Cette action est définitive et ne peut pas être annulée.';
      document.getElementById('generic-confirm-btn').innerText = confirmLabel || 'Supprimer';
      _genericConfirmCallback = onConfirm;
      document.getElementById('generic-confirm-modal').classList.remove('hidden');
    }
    function closeGenericConfirmModal() {
      document.getElementById('generic-confirm-modal').classList.add('hidden');
      _genericConfirmCallback = null;
    }
    function executeGenericConfirm() {
      const cb = _genericConfirmCallback;
      closeGenericConfirmModal();
      if (cb) cb();
    }

    function updateProfileUI() {
      if (!state || !state.profile) return;

      const welcomeName = document.getElementById('welcome-name');
      if (welcomeName) welcomeName.innerText = state.profile.firstname;

      const dashTitle = document.getElementById('dash-main-title');
      if (dashTitle) dashTitle.innerText = `Tableau de bord de ${state.profile.firstname} 🚀`;

      const profileFirstname = document.getElementById('profile-firstname');
      if (profileFirstname) profileFirstname.value = state.profile.firstname;

      const profileGender = document.getElementById('profile-gender');
      if (profileGender) profileGender.value = state.profile.gender;

      const profileLevel = document.getElementById('profile-level');
      if (profileLevel) profileLevel.value = state.profile.level;

      const profileImgPreview = document.getElementById('profile-img-preview');
      if (profileImgPreview && state.profile.img) profileImgPreview.src = state.profile.img;

      const sidebarImg = document.getElementById('sidebar-profile-img');
      if (sidebarImg && state.profile.img) sidebarImg.src = state.profile.img;
    }

    function updateProfileName(val) {
      state.profile.firstname = val || "Étudiant";
      saveState();
      updateProfileUI();
    }

    function saveProfileData() {
      state.profile.gender = document.getElementById('profile-gender').value;
      state.profile.level = document.getElementById('profile-level').value;
      saveState();
    }

    function updateProfileImgFromUrl(url) {
      if(url) {
        state.profile.img = url;
        saveState();
        updateProfileUI();
      }
    }

    function uploadProfileImg(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          state.profile.img = evt.target.result;
          saveState();
          updateProfileUI();
        }
        reader.readAsDataURL(file);
      }
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => {
        if(!el.getAttribute('onclick').includes('vacation')) {
          el.classList.remove('bg-brand-purple/20', 'text-brand-purple', 'border', 'border-brand-purple/30');
          el.classList.add('text-slate-400');
        } else {
          el.classList.remove('bg-emerald-500/20', 'border-emerald-500');
        }
      });
      
      const selectedTab = document.getElementById(`tab-${tabId}`);
      if(selectedTab) selectedTab.classList.remove('hidden');
      
      if(event && event.currentTarget) {
        if(tabId === 'vacation') {
          event.currentTarget.classList.add('bg-emerald-500/20', 'border-emerald-500');
          event.currentTarget.classList.remove('text-slate-400');
        } else {
          event.currentTarget.classList.add('bg-brand-purple/20', 'text-brand-purple', 'border', 'border-brand-purple/30');
          event.currentTarget.classList.remove('text-slate-400');
        }
      }

      if(tabId === 'dashboard') renderDashboard();
      if(tabId === 'revisions') renderRevisions();
      if(tabId === 'flashcards') { renderDecks(); renderFlashcardCharts(); }
      if(tabId === 'notes') renderNotes();
      if(tabId === 'todo') renderTodos();
      if(tabId === 'timetable') renderTimetable();
      if(tabId === 'vacation') renderVacation();
      if(tabId === 'pomodoro') renderPomodoroStats();
      if(tabId === 'profile') updateProfileUI();
    }

    function switchVacationSubTab(subId) {
      document.querySelectorAll('.vacation-sub-content').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(`sub-tab-${subId}`);
      if(target) target.classList.remove('hidden');
    }

    function checkStreak() {
      const today = new Date().toDateString();
      if (state.streak.lastLogin !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (state.streak.lastLogin === yesterday.toDateString()) state.streak.count++;
        else state.streak.count = 1;
        state.streak.lastLogin = today;
        saveState();
      }
      document.getElementById('streak-count').innerText = state.streak.count;
      document.getElementById('dash-streak-count').innerText = state.streak.count;
    }

    function renderDashboard() {
      const days = ["Dimanche", "Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi"];
      const now = new Date();
      document.getElementById('dash-today-name').innerText = days[now.getDay()];

      const todayIdx = (now.getDay() + 6) % 7;
      const todayTT = state.timetable.filter(item => parseInt(item.day) === todayIdx);
      const ttContainer = document.getElementById('dash-timetable');
      if(!todayTT.length) {
        ttContainer.innerHTML = '<p class="text-xs text-slate-500 italic">Aucun créneau prévu aujourd\'hui.</p>';
      } else {
        ttContainer.innerHTML = todayTT.map(i => `
          <div class="p-2.5 rounded-xl text-xs bg-[#0a0e17] border-l-4" style="border-color:${i.color}">
            <div class="font-bold text-white">${i.title}</div>
            <div class="text-[11px] text-slate-400">${i.start} - ${i.end}</div>
          </div>
        `).join('');
      }

      const dateKey = now.toISOString().split('T')[0];
      const todayTodos = state.todos[dateKey] || [];
      const todoContainer = document.getElementById('dash-todos');
      if(!todayTodos.length) {
        todoContainer.innerHTML = '<p class="text-xs text-slate-500 italic">Aucune tâche ajoutée.</p>';
      } else {
        todoContainer.innerHTML = todayTodos.map((t, index) => `
          <div class="flex items-center space-x-2 text-xs bg-[#0a0e17] p-2 rounded-xl">

      document.getElementById('tt-edit-id').value = '';
      document.getElementById('tt-title').value = '';
      document.getElementById('tt-desc').value = '';

    function editTimetableItem(id) {
      const item = state.timetable.find(i => i.id === id);
      if(!item) return;
      document.getElementById('tt-edit-id').value = item.id;
      document.getElementById('tt-title').value = item.title;

      document.getElementById('tt-start').value = item.start;
      document.getElementById('tt-end').value = item.end;

    function saveTimetableItem(e) {
      e.preventDefault();
      const editId = document.getElementById('tt-edit-id').value;
      if (editId) {
        const item = state.timetable.find(i => i.id === parseInt(editId));
        if (item) {
          item.title = document.getElementById('tt-title').value;
          item.day = document.getElementById('tt-day').value;
          item.tag = document.getElementById('tt-tag').value;
          item.start = document.getElementById('tt-start').value;
          item.end = document.getElementById('tt-end').value;
          item.desc = document.getElementById('tt-desc').value;
          item.color = document.getElementById('tt-color').value;
        }
      } else {
        state.timetable.push({
          id: Date.now(),
          title: document.getElementById('tt-title').value,
          day: document.getElementById('tt-day').value,
          tag: document.getElementById('tt-tag').value,
          start: document.getElementById('tt-start').value,
          end: document.getElementById('tt-end').value,
          desc: document.getElementById('tt-desc').value,
          color: document.getElementById('tt-color').value
        });

      renderTimetable();

    function deleteCurrentTimetableItem() {
      const editId = document.getElementById('tt-edit-id').value;
      if (editId) {
        state.timetable = state.timetable.filter(i => i.id !== parseInt(editId));
        saveState();
        renderTimetable();
        closeTimetableModal();
      }

    function deleteTimetableItemDirect(id, event) {
      event.stopPropagation();
      if(confirm("Supprimer ce créneau ?")) {
        state.timetable = state.timetable.filter(i => i.id !== id);
        saveState();
        renderTimetable();
      }
    }

    function copyTimetableItem(id, event) {

      const item = state.timetable.find(i => i.id === id);
      if(item) {
        copiedTimetableItem = { ...item };
        alert(`Créneau "${item.title}" copié ! Vous pouvez le coller sur un autre jour.`);

      }

    function pasteTimetableItem(targetDay) {

        const newItem = { ...copiedTimetableItem, id: Date.now(), day: targetDay.toString() };
        state.timetable.push(newItem);
        saveState();
        renderTimetable();

    function closeEventModal() { document.getElementById('event-modal').classList.add('hidden'); }

        title: document.getElementById('cal-title').value,
        date: document.getElementById('cal-date').value,
        repeat: document.getElementById('cal-repeat').value

    function renderCalendar() {
      const monthTitle = document.getElementById('calendar-month-title');
      const daysContainer = document.getElementById('calendar-days');
      daysContainer.innerHTML = '';
      const now = new Date();
      monthTitle.innerText = now.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

          </div>

    function changeMonth(delta) {}

    let currentTodoDate = new Date();
    // Tâche actuellement "copiée", en attente d'être collée (sur ce jour
    // ou un autre, après avoir navigué avec les flèches). Non persistée :
    // comme un presse-papiers classique, elle ne vit que le temps de la session.
    let copiedTodo = null;

    function copyTodo(dateKey, index) {
      const item = state.todos[dateKey] && state.todos[dateKey][index];
      if (!item) return;
      copiedTodo = { ...item };
      showToast(`📋 Tâche "${item.text}" copiée. Utilisez "Coller" pour la dupliquer.`);
      renderPasteButton();
    }

    function pasteTodo() {
      if (!copiedTodo) return;
      const dateKey = currentTodoDate.toISOString().split('T')[0];
      if (!state.todos[dateKey]) state.todos[dateKey] = [];
      state.todos[dateKey].push({ ...copiedTodo, done: false });
      saveState();
      renderTodos();
      showToast(`✅ Tâche "${copiedTodo.text}" collée sur cette journée.`);
    }

    function renderPasteButton() {
      const btn = document.getElementById('todo-paste-btn');
      if (!btn) return;
      if (copiedTodo) {
        btn.classList.remove('hidden');
        btn.title = `Coller "${copiedTodo.text}" sur cette journée`;
      } else {
        btn.classList.add('hidden');
      }
    }

    const TD_PRIO = { 1: 'Basse', 2: 'Moyenne', 3: 'Haute', 4: 'Urgente' };
    function tdEsc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function tdIcon(id) { return `<svg class="pg-ico"><use href="#pi-${id}"/></svg>`; }
    function tdFmtMin(m) { const h = Math.floor(m / 60); return h > 0 ? `${h} h ${String(m % 60).padStart(2, '0')}` : `${m} min`; }

    function renderTodoProgress(items) {
      const total = items.length, done = items.filter(i => i.done).length;
      const bar = document.querySelector('#td-ring .bar');
      if (bar) bar.style.strokeDashoffset = (163.36 * (1 - (total ? done / total : 0))).toFixed(2);
      document.getElementById('td-ring-txt').textContent = `${done}/${total}`;
      const title = document.getElementById('td-progress-title');
      title.textContent = !total ? 'Rien de prévu pour cette journée'
        : done === total ? 'Tout est fait, bravo !'
        : `${total - done} tâche${total - done > 1 ? 's' : ''} à faire`;
      const left = items.filter(i => !i.done).reduce((n, i) => n + (i.duration || 0), 0);
      const urgent = items.filter(i => !i.done && (i.urgency || 2) >= 4).length;
      const stats = [];
      if (total) stats.push(`<span class="td-stat">${tdIcon('list')}${done} terminée${done > 1 ? 's' : ''}</span>`);
      if (left) stats.push(`<span class="td-stat">${tdIcon('clock')}${tdFmtMin(left)} restantes</span>`);
      if (urgent) stats.push(`<span class="td-stat">${tdIcon('flag')}${urgent} urgente${urgent > 1 ? 's' : ''}</span>`);
      document.getElementById('td-stats').innerHTML = stats.join('');
    }

    function renderTodos() {
      const dateKey = currentTodoDate.toISOString().split('T')[0];
      const isToday = currentTodoDate.toDateString() === new Date().toDateString();
      const longDate = currentTodoDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      document.getElementById('todo-date-title').innerText = isToday ? "Aujourd'hui" : currentTodoDate.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
      document.getElementById('todo-date-sub').innerText = isToday ? longDate : String(currentTodoDate.getFullYear());
      renderPasteButton();

      const list = document.getElementById('todo-list');
      const items = state.todos[dateKey] || [];
      renderTodoProgress(items);

      const allDoneBanner = document.getElementById('todo-all-done-banner');
      if (items.length > 0 && items.every(i => i.done)) {
        allDoneBanner.classList.remove('hidden');
      } else {
        allDoneBanner.classList.add('hidden');
      }

      if (!items.length) {
        list.innerHTML = `<li class="pg-card td-empty"><div class="big">🌸</div><p>Aucune tâche pour ${isToday ? "aujourd'hui" : 'ce jour'}.<br>Ajoute-en une ci-dessus pour commencer.</p></li>`;
      } else {
        list.innerHTML = items.map((item, index) => {
          const u = Math.min(4, Math.max(1, item.urgency || 2));
          return `
          <li class="td-item p${u}${item.done ? ' done' : ''}">
            <input type="checkbox" class="td-check" ${item.done ? 'checked' : ''} onchange="toggleTodo('${dateKey}', ${index})" aria-label="Tâche terminée">
            <div class="td-body">
              <span class="td-name">${tdEsc(item.text)}</span>
              ${item.desc ? `<p class="td-desc">${tdEsc(item.desc)}</p>` : ''}
              <div class="td-tags">
                <span class="td-tag">${tdIcon('clock')}${tdEsc(item.time || 'Sans heure')}</span>
                ${item.duration ? `<span class="td-tag dur">${item.duration} min</span>` : ''}
                <span class="td-tag prio">${TD_PRIO[u]}</span>
              </div>
            </div>
            <div class="td-acts">
              <button onclick="copyTodo('${dateKey}', ${index})" class="td-act" title="Copier cette tâche" aria-label="Copier">${tdIcon('copy')}</button>
              <button onclick="openTodoEditModal('${dateKey}', ${index})" class="td-act" title="Modifier" aria-label="Modifier">${tdIcon('pencil')}</button>
              <button onclick="deleteTodo('${dateKey}', ${index})" class="td-act del" title="Supprimer" aria-label="Supprimer">${tdIcon('trash')}</button>
            </div>
          </li>`;
        }).join('');
      }

      renderGeneratedChronologicalSchedule();
    }

    function addTodo(e) {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const desc = document.getElementById('todo-desc').value;
      const duration = parseInt(document.getElementById('todo-duration').value) || 30;
      const time = document.getElementById('todo-time').value;
      const urgency = parseInt(document.getElementById('todo-urgency').value) || 2;
      const dateKey = currentTodoDate.toISOString().split('T')[0];

      if (!state.todos[dateKey]) state.todos[dateKey] = [];
      state.todos[dateKey].push({ text: input.value, desc, duration, time, urgency, done: false });

      input.value = '';
      document.getElementById('todo-desc').value = '';
      document.getElementById('todo-duration').value = '';
      document.getElementById('todo-time').value = '';
      saveState();
      renderTodos();
    }

    function toggleTodo(dateKey, index) {
      state.todos[dateKey][index].done = !state.todos[dateKey][index].done;
      saveState();
      
      if(state.todos[dateKey][index].done) {
        confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
      }

      const items = state.todos[dateKey];
      if (items.length > 0 && items.every(i => i.done)) {
        confetti({ particleCount: 200, spread: 100, origin: { y: 0.5 } });
      }

      renderTodos();
    }

    function deleteTodo(dateKey, index) {
      const item = state.todos[dateKey] && state.todos[dateKey][index];
      showConfirmModal(
        'Supprimer cette tâche ?',
        item ? `"${item.text}" sera définitivement supprimée.` : 'Cette action est définitive et ne peut pas être annulée.',
        () => {
          state.todos[dateKey].splice(index, 1);
          saveState();
          renderTodos();
        }
      );
    }

      document.getElementById('todo-edit-index').value = index;

    function closeTodoEditModal() {
      document.getElementById('todo-edit-modal').classList.add('hidden');
    }

    function saveEditedTodo(e) {
      e.preventDefault();
      const dateKey = document.getElementById('todo-edit-date').value;
      const index = parseInt(document.getElementById('todo-edit-index').value);
      if(state.todos[dateKey] && state.todos[dateKey][index]) {
        state.todos[dateKey][index].text = document.getElementById('todo-edit-text').value;
        state.todos[dateKey][index].desc = document.getElementById('todo-edit-desc').value;
        state.todos[dateKey][index].time = document.getElementById('todo-edit-time').value;
        state.todos[dateKey][index].duration = parseInt(document.getElementById('todo-edit-duration').value) || 30;
        state.todos[dateKey][index].urgency = parseInt(document.getElementById('todo-edit-urgency').value) || 2;

        renderTodos();
        closeTodoEditModal();
      }
    }

    function changeTodoDate(delta) {
      currentTodoDate.setDate(currentTodoDate.getDate() + delta);
      renderTodos();
    }

    function sortTodos(criterion) {
      const dateKey = currentTodoDate.toISOString().split('T')[0];
      let items = state.todos[dateKey] || [];
      if (!items.length) return;
      if (criterion === 'alpha') items.sort((a, b) => a.text.localeCompare(b.text));
      else if (criterion === 'time') items.sort((a, b) => (a.time || '23:59').localeCompare(b.time || '23:59'));
      else if (criterion === 'urgency') items.sort((a, b) => (b.urgency || 2) - (a.urgency || 2));
      else if (criterion === 'optimized') {
        const optimizedScore = (item) => {
          const urgency = item.urgency || 2;
          const duration = item.duration || 30;
          return urgency / Math.sqrt(duration);
        };
        items.sort((a, b) => optimizedScore(b) - optimizedScore(a));
      }
      saveState();
      renderTodos();
    }

    function renderGeneratedChronologicalSchedule() {
      const dateKey = currentTodoDate.toISOString().split('T')[0];
      const items = [...(state.todos[dateKey] || [])];
      const container = document.getElementById('todo-schedule-container');

      if (!items.length) {
        container.innerHTML = '<p class="td-tl-empty">Aucune tâche planifiée pour cette journée.</p>';
        container.classList.remove('td-tl');
        return;
      }
      container.classList.add('td-tl');

      items.sort((a, b) => (a.time || '23:59').localeCompare(b.time || '23:59'));

      container.innerHTML = items.map((item) => {
        let startTime = item.time || "09:00";
        let dur = item.duration || 30;
        let [h, m] = startTime.split(':').map(Number);
        let endMinutes = h * 60 + m + dur;
        let endTime = `${String(Math.floor(endMinutes / 60) % 24).padStart(2, '0')}:${String(endMinutes % 60).padStart(2, '0')}`;
        return `
          <div class="td-tl-item${item.done ? ' done' : ''}">
            <span class="td-tl-time">${startTime} – ${endTime}</span>
            <span class="td-tl-name">${tdEsc(item.text)}</span>
            <span class="td-tl-dur">${dur} min</span>
          </div>`;
      }).join('');
    }

    function addGeneratedScheduleToTimetable() {
      const dateKey = currentTodoDate.toISOString().split('T')[0];
      const items = state.todos[dateKey] || [];
      if(!items.length) { showToast("Aucune tâche à importer pour cette journée.", 'warning'); return; }

      const todayIdx = (currentTodoDate.getDay() + 6) % 7;
      let added = 0;

      items.forEach(t => {
        let startTime = t.time || "09:00";
        let dur = t.duration || 30;
        let [h, m] = startTime.split(':').map(Number);
        let endMinutes = h * 60 + m + dur;
        let endTime = `${String(Math.floor(endMinutes / 60) % 24).padStart(2, '0')}:${String(endMinutes % 60).padStart(2, '0')}`;

        state.timetable.push({
          id: Date.now() + Math.random(),
          title: t.text,
          day: todayIdx.toString(),
          tag: "Tâche Todo",
          start: startTime,
          end: endTime,
          desc: t.desc || "",
          color: "#94e2d5"
        });
        added++;
      });

      saveState();
      showToast(`✅ ${added} tâche${added > 1 ? 's' : ''} ajoutée${added > 1 ? 's' : ''} avec succès dans votre Emploi du Temps !`);
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      container.innerHTML = state.notes.map((n, idx) => `
        <div class="glass-panel border border-dark-border p-4 rounded-3xl space-y-3 card-glow relative">
          <div class="flex justify-between items-center border-b border-dark-border pb-2">
            <input type="text" value="${n.title || ''}" onchange="state.notes[${idx}].title=this.value; saveState();" placeholder="Titre..." class="bg-transparent font-bold text-white focus:outline-none w-full text-sm">
            <button onclick="deleteNote(${idx})" class="text-slate-500 hover:text-red-400 text-xs ml-2" title="Supprimer la note"><i class="fa-solid fa-trash"></i></button>

          <div class="flex flex-wrap items-center gap-1.5 bg-[#0a0e17] p-1.5 rounded-xl border border-dark-border text-xs">
            <button onclick="formatNoteText(${idx}, 'bold')" class="px-2 py-0.5 bg-slate-800 rounded font-bold">B</button>
            <button onclick="formatNoteText(${idx}, 'italic')" class="px-2 py-0.5 bg-slate-800 rounded italic">I</button>
            <button onclick="formatNoteText(${idx}, 'underline')" class="px-2 py-0.5 bg-slate-800 rounded underline">U</button>

            <span class="text-[10px] text-slate-400 ml-1">Surligner:</span>
            <button onclick="highlightNoteText(${idx}, '#fef08a')" class="w-4 h-4 rounded-full bg-yellow-200 border" title="Jaune Pastel"></button>
            <button onclick="highlightNoteText(${idx}, '#bbf7d0')" class="w-4 h-4 rounded-full bg-green-200 border" title="Vert Pastel"></button>
            <button onclick="highlightNoteText(${idx}, '#bfdbfe')" class="w-4 h-4 rounded-full bg-blue-200 border" title="Bleu Pastel"></button>
            <button onclick="highlightNoteText(${idx}, '#fbcfe8')" class="w-4 h-4 rounded-full bg-pink-200 border" title="Rose Pastel"></button>

            <input type="color" onchange="changeNoteTextColor(${idx}, this.value)" title="Couleur de écriture" class="w-5 h-5 bg-transparent cursor-pointer ml-1">
            <select onchange="changeNoteFont(${idx}, this.value)" class="bg-slate-800 text-[10px] text-slate-200 rounded p-0.5">
              <option value="sans-serif">Sans-Serif</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
              <option value="cursive">Cursive</option>
            </select>
          </div>

          <div id="note-body-${idx}" contenteditable="true" oninput="saveNoteContent(${idx})" class="w-full h-28 bg-[#0a0e17] p-3 rounded-xl text-xs text-slate-200 focus:outline-none overflow-y-auto custom-scrollbar leading-relaxed" style="font-family: ${n.font || 'sans-serif'}; color: ${n.color || '#e2e8f0'}">
            ${n.content || ''}
          </div>
        </div>
      `).join('');
    }

    function addNote() { state.notes.push({ title: '', content: '', font: 'sans-serif', color: '#e2e8f0' }); saveState(); renderNotes(); }
    function deleteNote(idx) { state.notes.splice(idx, 1); saveState(); renderNotes(); }
    function saveNoteContent(idx) {
      const el = document.getElementById(`note-body-${idx}`);
      if(el) { state.notes[idx].content = el.innerHTML; saveState(); }
    }
    function formatNoteText(idx, cmd) {
      document.execCommand(cmd, false, null);
      saveNoteContent(idx);
    }
    function highlightNoteText(idx, color) {
      document.execCommand('hiliteColor', false, color);
      saveNoteContent(idx);
    }
    function changeNoteTextColor(idx, color) {
      document.execCommand('foreColor', false, color);
      saveNoteContent(idx);
    }
    function changeNoteFont(idx, font) {
      state.notes[idx].font = font;
      const el = document.getElementById(`note-body-${idx}`);
      if(el) el.style.fontFamily = font;
      saveState();
    }

    function openGradeModal() { renderGradeSelects(); document.getElementById('grade-modal').classList.remove('hidden'); }
    function closeGradeModal() { document.getElementById('grade-modal').classList.add('hidden'); }
    function openPeriodModal() { const p = prompt("Nouvelle Période (ex: Semestre 3) :"); if(p) { state.periods.push(p); saveState(); renderGradeSelects(); } }
    function openEvalTypeModal() { const t = prompt("Nouveau Type d'évaluation (ex: TP, Oral, Quiz) :"); if(t) { state.evalTypes.push(t); saveState(); renderGradeSelects(); } }

    function renderGradeSelects() {
      document.getElementById('grade-period-filter').innerHTML = state.periods.map(p => `<option value="${p}">${p}</option>`).join('');
      document.getElementById('grade-period').innerHTML = state.periods.map(p => `<option value="${p}">${p}</option>`).join('');
      document.getElementById('grade-type').innerHTML = state.evalTypes.map(t => `<option value="${t}">${t}</option>`).join('');
    }

    function saveGrade(e) {
      e.preventDefault();
      state.grades.push({
        id: Date.now(),
        subject: document.getElementById('grade-subject').value,
        title: document.getElementById('grade-title').value,
        type: document.getElementById('grade-type').value,
        period: document.getElementById('grade-period').value,
        value: parseFloat(document.getElementById('grade-value').value),
        coeff: parseFloat(document.getElementById('grade-coeff').value)
      });
      saveState();
      renderGrades();
      closeGradeModal();
    }

    function renderGrades() {
      const tbody = document.getElementById('grades-table-body');
      tbody.innerHTML = state.grades.map(g => `
        <tr>
          <td class="p-3 font-semibold text-white">${g.subject}</td>
          <td class="p-3 text-slate-300">${g.title}</td>
          <td class="p-3"><span class="bg-brand-purple/20 text-brand-purple text-xs px-2 py-0.5 rounded font-bold">${g.type}</span></td>
          <td class="p-3 font-bold text-emerald-400">${g.value}/20</td>
          <td class="p-3">x${g.coeff}</td>
          <td class="p-3">${g.period}</td>
          <td class="p-3 text-right"><button onclick="deleteGrade(${g.id})" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button></td>
        </tr>
      `).join('');

      if(state.grades.length) {
        let totalVal = 0, totalCoeff = 0;
        state.grades.forEach(g => { totalVal += g.value * g.coeff; totalCoeff += g.coeff; });
        const avg = (totalVal / totalCoeff).toFixed(2);
        document.getElementById('overall-average').innerText = `${avg} / 20`;
        document.getElementById('total-evals').innerText = state.grades.length;
      }
    }
    function deleteGrade(id) { state.grades = state.grades.filter(g => g.id !== id); saveState(); renderGrades(); }

    function renderDecks() {
      const container = document.getElementById('decks-container');
      container.innerHTML = '';

      state.decks.forEach((deck, deckIdx) => {
        container.innerHTML += `
          <div class="glass-panel border border-dark-border p-5 rounded-3xl space-y-4 card-glow relative">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-lg text-white">${deck.title}</h3>
                <span class="text-xs bg-brand-purple/20 text-brand-purple px-2 py-0.5 rounded-full font-medium">${deck.cards.length} cartes</span>
              </div>
              <button onclick="deleteDeck(${deckIdx})" class="text-slate-500 hover:text-red-400 text-xs"><i class="fa-solid fa-trash"></i></button>
            </div>

            <div class="grid grid-cols-3 gap-1.5 text-[11px] font-bold">
              <button onclick="startStudyMode(${deckIdx}, 'learning')" class="bg-brand-purple/20 text-brand-purple hover:bg-brand-purple/30 p-2 rounded-xl border border-brand-purple/30 text-center">Apprentissage 🧠</button>
              <button onclick="startStudyMode(${deckIdx}, 'quiz')" class="bg-brand-cyan/20 text-brand-cyan hover:bg-brand-cyan/30 p-2 rounded-xl border border-brand-cyan/30 text-center">Se Tester (QCM) 🎮</button>
              <button onclick="startStudyMode(${deckIdx}, 'eval')" class="bg-brand-pink/20 text-brand-pink hover:bg-brand-pink/30 p-2 rounded-xl border border-brand-pink/30 text-center">S'Évaluer 📝</button>
            </div>
            
            <button onclick="openCardModal(${deckIdx})" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-xl border border-dark-border"><i class="fa-solid fa-plus mr-1"></i> Ajouter une carte</button>
          </div>
        `;
      });
    }

    function openDeckModal() {
      const title = prompt("Nom du nouveau paquet de flashcards :");
      if (title) { state.decks.push({ id: Date.now(), title, cards: [] }); saveState(); renderDecks(); }
    }
    function deleteDeck(idx) { if(confirm("Supprimer ce paquet ?")) { state.decks.splice(idx, 1); saveState(); renderDecks(); } }

    let currentEditingDeckIdx = null;
    function openCardModal(deckIdx) {
      currentEditingDeckIdx = deckIdx;
      document.getElementById('card-modal-q').value = '';
      document.getElementById('card-modal-a').value = '';
      document.getElementById('card-modal').classList.remove('hidden');
    }
    function closeCardModal() { document.getElementById('card-modal').classList.add('hidden'); }
    function saveCardModal(e) {
      e.preventDefault();
      const q = document.getElementById('card-modal-q').value.trim();
      const a = document.getElementById('card-modal-a').value.trim();
      if(q && a && currentEditingDeckIdx !== null) {
        state.decks[currentEditingDeckIdx].cards.push({ q, a, level: 0 });
        saveState();
        renderDecks();
        closeCardModal();
      }
    }

    let activeDeckObj = null, studyMode = 'learning', activeCardIndex = 0, evalScore = 0;
    function startStudyMode(deckIdx, mode) {
      activeDeckObj = state.decks[deckIdx];
      if (!activeDeckObj.cards.length) return alert("Ajoutez des cartes à ce paquet avant de commencer.");
      studyMode = mode;
      activeCardIndex = 0;
      evalScore = 0;

      document.getElementById('study-deck-title').innerText = activeDeckObj.title;
      document.getElementById('study-mode-badge').innerText = mode === 'learning' ? 'Apprentissage' : (mode === 'quiz' ? 'Se Tester (QCM)' : 'Évaluation');
      
      document.getElementById('mode-learning-container').classList.toggle('hidden', mode !== 'learning');
      document.getElementById('mode-quiz-container').classList.toggle('hidden', mode !== 'quiz');
      document.getElementById('mode-eval-container').classList.toggle('hidden', mode !== 'eval');

      document.getElementById('flashcard-study-view').classList.remove('hidden');
      loadCurrentStudyStep();
    }

    function loadCurrentStudyStep() {
      if (activeCardIndex >= activeDeckObj.cards.length) {
        if(studyMode === 'eval') {
          const finalGrade = ((evalScore / activeDeckObj.cards.length) * 20).toFixed(1);
          alert(`Évaluation terminée ! Votre note est de ${finalGrade} / 20.`);
          state.flashcardHistory.push({ deckTitle: activeDeckObj.title, score: parseFloat(finalGrade), date: new Date().toLocaleDateString('fr-FR', {month: 'short', year:'numeric'}) });
          saveState();
          renderFlashcardCharts();
        } else {
          alert("Session terminée avec succès !");
        }
        closeStudyView();
        return;
      }

      const card = activeDeckObj.cards[activeCardIndex];

      if(studyMode === 'learning') {
        document.getElementById('card-question').innerText = card.q;
        document.getElementById('card-answer').innerText = card.a;
        document.getElementById('study-progress').innerText = `Carte ${activeCardIndex + 1} / ${activeDeckObj.cards.length}`;
        document.getElementById('card-inner').classList.remove('card-flipped');
      } else if(studyMode === 'quiz') {
        document.getElementById('quiz-question-text').innerText = card.q;
        const optionsContainer = document.getElementById('quiz-options-container');
        optionsContainer.innerHTML = '';
        
        let answers = [card.a];
        state.decks.flatMap(d => d.cards).forEach(c => {
          if(c.a !== card.a && answers.length < 4) answers.push(c.a);
        });
        answers.sort(() => Math.random() - 0.5);

        answers.forEach(ans => {
          optionsContainer.innerHTML += `<button onclick="answerQuiz('${ans.replace(/'/g, "\\'")}', '${card.a.replace(/'/g, "\\'")}')" class="bg-[#0a0e17] hover:bg-brand-purple/20 border border-dark-border p-3 rounded-xl text-xs text-white text-center font-medium">${ans}</button>`;
        });
      } else if(studyMode === 'eval') {
        document.getElementById('eval-question-text').innerText = card.q;
        document.getElementById('eval-user-answer').value = '';
      }
    }

    function rateCardMemory(known) {
      const card = activeDeckObj.cards[activeCardIndex];
      if(known) card.level = (card.level || 0) + 1;
      else card.level = Math.max(0, (card.level || 0) - 1);
      
      saveState();
      activeCardIndex++;
      loadCurrentStudyStep();
    }

    function answerQuiz(selected, correct) {
      if(selected === correct) alert("Bonne réponse ! 🎉");
      else alert(`Dommage ! La bonne réponse était : ${correct}`);
      activeCardIndex++;
      loadCurrentStudyStep();
    }

    function submitEvalAnswer() {
      const userAns = document.getElementById('eval-user-answer').value.trim().toLowerCase();
      const correctAns = activeDeckObj.cards[activeCardIndex].a.trim().toLowerCase();
      if(userAns.includes(correctAns) || correctAns.includes(userAns)) evalScore++;
      activeCardIndex++;
      loadCurrentStudyStep();
    }

    function closeStudyView() { document.getElementById('flashcard-study-view').classList.add('hidden'); }

    let fcChart = null;
    function renderFlashcardCharts() {
      const ctx = document.getElementById('flashcardsProgressChart').getContext('2d');
      if (fcChart) fcChart.destroy();
      
      const labels = state.flashcardHistory.map(h => `${h.deckTitle} (${h.date})`);
      const data = state.flashcardHistory.map(h => h.score);

      fcChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels.length ? labels : ['Aucune évaluation'],
          datasets: [{
            label: 'Notes d\'évaluation (/20)',
            data: data.length ? data : [0],
            borderColor: '#f5c2e7',
            backgroundColor: 'rgba(245, 194, 231, 0.15)',
            fill: true,
            tension: 0.3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { min: 0, max: 20, grid: { color: '#1f293d' } } }
        }
      });
    }

    // POMODORO & STATISTIQUES D'ÉTUDE
    let timerInterval = null, timerSeconds = 25 * 60, isRunning = false;
    let accumulatedSecondsCurrentSession = 0;

    function togglePomodoro() {
      const btn = document.getElementById('pomo-btn');
      const workMin = parseInt(document.getElementById('pomo-work-input').value) || 25;
      if (!isRunning) {
        if(timerSeconds === 25 * 60) timerSeconds = workMin * 60;
        timerInterval = setInterval(updateTimer, 1000);
        btn.innerHTML = `<i class="fa-solid fa-pause mr-2"></i>Pause`;
      } else {
        clearInterval(timerInterval);
        btn.innerHTML = `<i class="fa-solid fa-play mr-2"></i>Démarrer`;
      }
      isRunning = !isRunning;
    }

    function updateTimer() {
      if (timerSeconds > 0) {
        timerSeconds--;
        accumulatedSecondsCurrentSession++;
        renderTimerDisplay();
      } else {
        clearInterval(timerInterval);
        isRunning = false;
        document.getElementById('pomo-btn').innerHTML = `<i class="fa-solid fa-play mr-2"></i>Démarrer`;
        alert("Session Pomodoro terminée ! Le temps a été ajouté aux statistiques d'étude. 🎉");
        logPomodoroTime(accumulatedSecondsCurrentSession);
        accumulatedSecondsCurrentSession = 0;
        resetPomodoro();
      }
    }

    function stopAndLogPomodoro() {
      clearInterval(timerInterval);
      isRunning = false;
      document.getElementById('pomo-btn').innerHTML = `<i class="fa-solid fa-play mr-2"></i>Démarrer`;
      if(accumulatedSecondsCurrentSession > 0) {
        logPomodoroTime(accumulatedSecondsCurrentSession);
        alert(`Session arrêtée. ${Math.round(accumulatedSecondsCurrentSession / 60)} min ajoutées aux statistiques d'étude !`);
        accumulatedSecondsCurrentSession = 0;
      }
      resetPomodoro();
    }

    function resetPomodoro() {
      clearInterval(timerInterval);
      const workMin = parseInt(document.getElementById('pomo-work-input').value) || 25;
      timerSeconds = workMin * 60;
      renderTimerDisplay();
    }

    function renderTimerDisplay() {
      const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      const s = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById('pomo-timer').innerText = `${m}:${s}`;
    }

    function logPomodoroTime(seconds) {
      const mins = Math.round(seconds / 60);
      if(mins <= 0) return;
      state.stats.todayMinutes += mins;
      const todayDayIdx = (new Date().getDay() + 6) % 7;
      state.stats.weeklyMinutes[todayDayIdx] += mins;
      saveState();
      renderPomodoroStats();
    }

    function renderPomodoroStats() {
      document.getElementById('stats-today').innerText = `${state.stats.todayMinutes} min`;
      const totalWeekMins = state.stats.weeklyMinutes.reduce((a, b) => a + b, 0);
      document.getElementById('stats-week').innerText = `${(totalWeekMins / 60).toFixed(1)} h`;

      const ctx = document.getElementById('statsChart').getContext('2d');
      if(statsChartInstance) statsChartInstance.destroy();

      statsChartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: ['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'],
          datasets: [{
            label: 'Minutes étudiées',
            data: state.stats.weeklyMinutes,
            backgroundColor: '#cba6f7',
            borderRadius: 8
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { y: { beginAtZero: true, grid: { color: '#1f293d' } } }
        }
      });
    }

    function changePomodoroBg(url) {
      if(url) {
        document.getElementById('pomo-bg').style.backgroundImage = `url('${url}')`;
      }
    }


    // Empêche la musique de s'arrêter quand on change d'onglet du navigateur.
    // (Le veilleur est retiré dès que l'on coupe volontairement la musique.)
    function benkyoGuardMedia(el) {
      if (!el || !window.BenkyoStorage || !BenkyoStorage.keepMediaPlaying) return;
      if (el.__benkyoGuard) el.__benkyoGuard();
      el.__benkyoGuard = BenkyoStorage.keepMediaPlaying(el, function () { return true; });
    }
    function benkyoUnguardMedia(el) {
      if (el && el.__benkyoGuard) { el.__benkyoGuard(); el.__benkyoGuard = null; }
    }

    function toggleLofiMusic() {
      const btn = document.getElementById('lofi-toggle-btn');
      if(!lofiAudio) {
        lofiAudio = new Audio('https://stream.zeno.fm/f3wvbbqmdg8uv');
        lofiAudio.play();
        benkyoGuardMedia(lofiAudio);
        btn.classList.add('bg-brand-purple', 'text-white');
        btn.innerHTML = `<i class="fa-solid fa-volume-high"></i> Couper la Musique Lofi`;
      } else {
        benkyoUnguardMedia(lofiAudio);
        lofiAudio.pause();
        lofiAudio = null;
        btn.classList.remove('bg-brand-purple', 'text-white');
        btn.innerHTML = `<i class="fa-solid fa-music"></i> Activer l'Ambiance Musique Lofi`;
      }
    }

    function renderVacation() {
      const supList = document.getElementById('supplies-list');
      supList.innerHTML = state.vacation.supplies.map((item, idx) => `
        <li class="flex justify-between items-center bg-[#0a0e17] p-3 rounded-xl text-xs border border-dark-border">
          <div class="flex items-center space-x-2">
            <input type="checkbox" ${item.done ? 'checked' : ''} onchange="state.vacation.supplies[${idx}].done=!state.vacation.supplies[${idx}].done; saveState(); renderVacation();" class="rounded text-brand-cyan">
            <span class="${item.done ? 'line-through text-slate-500' : 'text-slate-200'}">${item.text}</span>
          </div>
          <button onclick="state.vacation.supplies.splice(${idx},1); saveState(); renderVacation();" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
        </li>
      `).join('');

      const bookList = document.getElementById('summer-books-list');
      bookList.innerHTML = state.vacation.books.map((b, idx) => `
        <li class="bg-[#0a0e17] p-3 rounded-2xl text-xs border border-dark-border space-y-2">
          <div class="flex justify-between font-bold text-white">
            <span>${b.title}</span>
            <button onclick="state.vacation.books.splice(${idx},1); saveState(); renderVacation();" class="text-slate-500 hover:text-red-400"><i class="fa-solid fa-trash"></i></button>
          </div>
          <select onchange="state.vacation.books[${idx}].status=this.value; saveState(); renderVacation();" class="w-full bg-slate-800 text-slate-200 p-2 rounded-lg">
            <option value="à lire" ${b.status==='à lire'?'selected':''}>À lire 🔴</option>
            <option value="en cours" ${b.status==='en cours'?'selected':''}>En cours 🟡</option>
            <option value="lu" ${b.status==='lu'?'selected':''}>Lu 🟢</option>
          </select>
        </li>
      `).join('');

      const latinList = document.getElementById('latin-history-list');
      latinList.innerHTML = state.vacation.latin.map((l, idx) => `
        <div class="bg-[#0a0e17] p-3 rounded-xl text-xs flex justify-between items-center border border-dark-border">
          <div>
            <div class="font-bold text-amber-400 text-sm">${l.title}</div>
            <div class="text-[10px] text-slate-400">${l.date}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="text-amber-400 font-bold">${'★'.repeat(l.stars)}</div>
            <button onclick="openLatinEditModal(${idx})" class="text-slate-400 hover:text-white bg-slate-800 px-2 py-1 rounded" title="Modifier"><i class="fa-solid fa-pen"></i></button>
            <button onclick="state.vacation.latin.splice(${idx},1); saveState(); renderVacation();" class="text-slate-500 hover:text-red-400 bg-slate-800 px-2 py-1 rounded" title="Supprimer"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>
      `).join('');
    }

    function addSupplyItem(e) {
      e.preventDefault();
      const input = document.getElementById('supply-input');
      state.vacation.supplies.push({ text: input.value, done: false });
      input.value = '';
      saveState();
      renderVacation();
    }

    function addSummerBook(e) {
      e.preventDefault();
      const title = document.getElementById('book-title-input').value;
      const status = document.getElementById('book-status-input').value;
      state.vacation.books.push({ title, status });
      document.getElementById('book-title-input').value = '';
      saveState();
      renderVacation();
    }

    function setLatinStars(count) {
      selectedLatinStars = count;
      const stars = document.querySelectorAll('#latin-star-rating .star');
      stars.forEach((s, idx) => {
        if(idx < count) s.classList.add('text-amber-400');
        else s.classList.remove('text-amber-400');
      });
    }

    function addLatinEntry(e) {
      e.preventDefault();
      const title = document.getElementById('latin-title').value;
      if(!selectedLatinStars) return alert("Veuillez évaluer la difficulté en cliquant sur les étoiles.");
      state.vacation.latin.unshift({ title, stars: selectedLatinStars, date: new Date().toLocaleDateString('fr-FR') });
      document.getElementById('latin-title').value = '';
      selectedLatinStars = 0;
      setLatinStars(0);
      saveState();
      renderVacation();
    }

    function openLatinEditModal(idx) {
      const item = state.vacation.latin[idx];
      document.getElementById('latin-edit-index').value = idx;
      document.getElementById('latin-edit-title').value = item.title;
      editLatinStarsCount = item.stars;
      setEditLatinStars(editLatinStarsCount);
      document.getElementById('latin-edit-modal').classList.remove('hidden');
    }

    function closeLatinEditModal() {
      document.getElementById('latin-edit-modal').classList.add('hidden');
    }

    function setEditLatinStars(count) {
      editLatinStarsCount = count;
      const stars = document.querySelectorAll('#latin-edit-star-rating .edit-star');
      stars.forEach((s, idx) => {
        if(idx < count) s.classList.add('text-amber-400');
        else s.classList.remove('text-amber-400');
      });
    }

    function saveEditedLatin(e) {
      e.preventDefault();
      const idx = parseInt(document.getElementById('latin-edit-index').value);
      const newTitle = document.getElementById('latin-edit-title').value;
      if(state.vacation.latin[idx]) {
        state.vacation.latin[idx].title = newTitle;
        state.vacation.latin[idx].stars = editLatinStarsCount;
        saveState();
        renderVacation();
        closeLatinEditModal();
      }
    }

    function benkyoInitPage() {
      try { updateProfileUI(); } catch(e) {}
      try { checkStreak(); } catch(e) {}
      try { renderDashboard(); } catch(e) {}
      try { renderTimetable(); } catch(e) {}
      try { renderCalendar(); } catch(e) {}
      try { renderTodos(); } catch(e) {}
      try { renderRevisions(); } catch(e) {}
      try { renderNotes(); } catch(e) {}
      try { renderGradeSelects(); } catch(e) {}
      try { renderGrades(); } catch(e) {}
      try { renderDecks(); } catch(e) {}
      try { renderVacation(); } catch(e) {}
      try { renderPomodoroStats(); } catch(e) {}
    }
    // DOMContentLoaded plutôt que window.onload : voir explication dans les
    // autres pages — "load" peut ne jamais se déclencher si une ressource
    // externe est lente/bloquée, laissant la page à moitié vide.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', benkyoInitPage);
    } else {
      benkyoInitPage();
    }
  </script>
  <script src="menu-nav.js"></script>
</body>
</html>
