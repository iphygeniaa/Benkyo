  <style>
    /* Custom scrollbar optimizations */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #F4F0E6; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #B88758; border-radius: 4px; }
    
    /* Optimized rendering performance with GPU acceleration */
    .glass-panel { 
      background: rgba(15, 20, 32, 0.85); 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.25);
      contain: content;
    }

    .card-glow { 
      transition: border-color 0.2s ease, transform 0.2s ease; 
    }
    .card-glow:hover { 
      border-color: rgba(203, 166, 247, 0.4); 
      transform: translateY(-2px); 
    }
    
    .card-flip { perspective: 1000px; }
    .card-inner { transition: transform 0.4s ease; transform-style: preserve-3d; }
    .card-flipped { transform: rotateY(180deg); }
    .card-front, .card-back { backface-visibility: hidden; position: absolute; inset: 0; }
    .card-back { transform: rotateY(180deg); }

    .tab-content.hidden { display: none; }

    @keyframes welcomeFade {
      0% { opacity: 1; transform: scale(1); }
      80% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0; transform: scale(0.95); visibility: hidden; }
    }
    .welcome-overlay { animation: welcomeFade 2.5s forwards ease-in-out; }
  </style>

  <main class="flex-1 md:overflow-y-auto custom-scrollbar relative">
  <div class="rpg-parchment">
    <div class="rpg-questbar">
      <img src="mascotte.png" alt="">
      <div>
        <div class="rpg-questbar-title">Pense-bête</div>

      </div>

    </div>

    <section id="tab-notes" class="tab-content space-y-6">
      <div class="flex justify-between items-center">
        <h1 class="text-3xl font-extrabold text-white">Pense-bête</h1>
        <button onclick="addNote()" class="bg-brand-purple hover:bg-brand-purple/80 text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center space-x-2 transition shadow-lg shadow-brand-purple/20"><i class="fa-solid fa-plus"></i><span>Nouvelle note</span></button>
      </div>

    </section>

  <script src="app.js"></script>
  <script src="pixel-deco.js" defer></script>
  <script src="tampons.js" defer></script>
  <script>
    let state = BenkyoStorage.load();
    BenkyoStorage.autoFlushOn(state);

    let copiedTimetableItem = null;
    let selectedLatinStars = 0;
    let editLatinStarsCount = 0;
    let lofiAudio = null;
    let statsChartInstance = null;
    let noteDebounceTimer = null;

    function saveState() {
      BenkyoStorage.save(state);
    }

    function updateProfileUI() {
      const wName = document.getElementById('welcome-name');
      if(wName) wName.innerText = state.profile.firstname;
      const dTitle = document.getElementById('dash-main-title');
      if(dTitle) dTitle.innerText = `Zone de campement de ${state.profile.firstname}`;
      
      const pFirstname = document.getElementById('profile-firstname');
      if(pFirstname) pFirstname.value = state.profile.firstname;
      const pGender = document.getElementById('profile-gender');
      if(pGender) pGender.value = state.profile.gender;
      const pLevel = document.getElementById('profile-level');
      if(pLevel) pLevel.value = state.profile.level;
      
      const pPreview = document.getElementById('profile-img-preview');
      if(pPreview) pPreview.src = state.profile.img;
      const sidebarImg = document.getElementById('sidebar-profile-img');
      if(sidebarImg) sidebarImg.src = state.profile.img;
    }

    function updateProfileName(val) {
      state.profile.firstname = val || "Étudiant";
      saveState();
      updateProfileUI();
    }

    function saveProfileData() {
      state.profile.gender = document.getElementById('profile-gender').value;
      state.profile.level = document.getElementById('profile-level').value;
      saveState();
    }

    function updateProfileImgFromUrl(url) {
      if(url) {
        state.profile.img = url;
        saveState();
        updateProfileUI();
      }
    }

    function uploadProfileImg(e) {
      const file = e.target.files[0];
      if(file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          state.profile.img = evt.target.result;
          saveState();
          updateProfileUI();
        }
        reader.readAsDataURL(file);
      }
    }

    function checkStreak() {
      const today = new Date().toDateString();
      if (state.streak.lastLogin !== today) {
        const yesterday = new Date();
        yesterday.setDate(yesterday.getDate() - 1);
        if (state.streak.lastLogin === yesterday.toDateString()) state.streak.count++;
        else state.streak.count = 1;
        state.streak.lastLogin = today;
        saveState();
      }
      const sCount = document.getElementById('streak-count');
      if(sCount) sCount.innerText = state.streak.count;
      const dStreak = document.getElementById('dash-streak-count');
      if(dStreak) dStreak.innerText = state.streak.count;
    }

    function renderNotes() {
      const container = document.getElementById('notes-container');
      if(!container) return;
      container.innerHTML = state.notes.map((n, idx) => `
        <div class="glass-panel border border-dark-border p-4 rounded-3xl space-y-3 card-glow relative">
          <div class="flex justify-between items-center border-b border-dark-border pb-2">
            <input type="text" value="${n.title || ''}" onchange="state.notes[${idx}].title=this.value; saveState();" placeholder="Titre..." class="bg-transparent font-bold text-white focus:outline-none w-full text-sm">
            <button onclick="deleteNote(${idx})" class="text-slate-500 hover:text-red-400 text-xs ml-2" title="Supprimer la note"><i class="fa-solid fa-trash"></i></button>
          </div>

          <div class="flex flex-wrap items-center gap-1.5 bg-[#F4F0E6] p-1.5 rounded-xl border border-dark-border text-xs">
            <button onclick="formatNoteText(${idx}, 'bold')" class="px-2 py-0.5 bg-slate-800 rounded font-bold">B</button>
            <button onclick="formatNoteText(${idx}, 'italic')" class="px-2 py-0.5 bg-slate-800 rounded italic">I</button>
            <button onclick="formatNoteText(${idx}, 'underline')" class="px-2 py-0.5 bg-slate-800 rounded underline">U</button>

            <span class="text-[10px] text-slate-400 ml-1">Surligner:</span>
            <button onclick="highlightNoteText(${idx}, '#EFE0B4')" class="hl-swatch hl-yellow" title="Jaune Pastel (recliquer pour désurligner)"></button>
            <button onclick="highlightNoteText(${idx}, '#C7DAB4')" class="hl-swatch hl-green" title="Vert Pastel (recliquer pour désurligner)"></button>
            <button onclick="highlightNoteText(${idx}, '#AFC8DD')" class="hl-swatch hl-blue" title="Bleu Pastel (recliquer pour désurligner)"></button>
            <button onclick="highlightNoteText(${idx}, '#F0C1B3')" class="hl-swatch hl-pink" title="Rose Pastel (recliquer pour désurligner)"></button>
            <button onclick="removeHighlightNoteText(${idx})" class="hl-swatch hl-none flex items-center justify-center" title="Annuler le surlignage">
              <i class="fa-solid fa-xmark text-[8px] text-slate-400"></i>
            </button>

            <input type="color" onchange="changeNoteTextColor(${idx}, this.value)" title="Couleur de écriture" class="w-5 h-5 bg-transparent cursor-pointer ml-1">
            <select onchange="changeNoteFont(${idx}, this.value)" class="bg-slate-800 text-[10px] text-slate-200 rounded p-0.5">
              <option value="sans-serif">Sans-Serif</option>
              <option value="serif">Serif</option>
              <option value="monospace">Monospace</option>
              <option value="cursive">Cursive</option>
            </select>
          </div>

          <div id="note-body-${idx}" contenteditable="true" oninput="debouncedSaveNote(${idx})" class="w-full h-28 bg-[#F4F0E6] p-3 rounded-xl text-xs text-slate-200 focus:outline-none overflow-y-auto custom-scrollbar leading-relaxed" style="font-family: ${n.font || 'sans-serif'}; color: ${n.color || '#E9E1D0'}">
            ${n.content || ''}
          </div>
        </div>
      `).join('');
    }

    function addNote() { state.notes.push({ title: '', content: '', font: 'sans-serif', color: '#E9E1D0' }); saveState(); renderNotes(); }
    function deleteNote(idx) { state.notes.splice(idx, 1); saveState(); renderNotes(); }
    
    /* Debounced saving prevents lag while typing in contenteditable notes */
    function debouncedSaveNote(idx) {
      clearTimeout(noteDebounceTimer);
      noteDebounceTimer = setTimeout(() => {
        saveNoteContent(idx);
      }, 300);
    }

    function saveNoteContent(idx) {
      const el = document.getElementById(`note-body-${idx}`);
      if(el) { state.notes[idx].content = el.innerHTML; saveState(); }
    }
    function formatNoteText(idx, cmd) {
      document.execCommand(cmd, false, null);
      saveNoteContent(idx);
    }
    // Normalise une couleur (hex ou rgb) en chaîne rgb() comparable
    function normalizeColorString(c) {
      if (!c) return null;
      const probe = document.createElement('div');
      probe.style.color = c;
      document.body.appendChild(probe);
      const rgb = getComputedStyle(probe).color;
      document.body.removeChild(probe);
      return rgb;
    }

    // Surligne le texte sélectionné. Si la sélection porte déjà cette
    // même couleur de surlignage, on la retire (toggle "désurligner").
    function highlightNoteText(idx, color) {
      const currentValue = document.queryCommandValue('hiliteColor') || document.queryCommandValue('backColor');
      const currentNormalized = normalizeColorString(currentValue);
      const targetNormalized = normalizeColorString(color);
      if (currentNormalized && currentNormalized === targetNormalized) {
        removeHighlightNoteText(idx);
        return;
      }
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('hiliteColor', false, color);
      saveNoteContent(idx);
    }

    // Retire complètement le surlignage sur la sélection courante
    function removeHighlightNoteText(idx) {
      document.execCommand('styleWithCSS', false, true);
      document.execCommand('hiliteColor', false, 'transparent');
      saveNoteContent(idx);
    }
    function changeNoteTextColor(idx, color) {
      document.execCommand('foreColor', false, color);
      saveNoteContent(idx);
    }
    function changeNoteFont(idx, font) {
      state.notes[idx].font = font;
      const el = document.getElementById(`note-body-${idx}`);
      if(el) el.style.fontFamily = font;
      saveState();
    }

    /* Lazy-loaded initialization prevents lag on startup */
    function benkyoInitPage() {
      try { updateProfileUI(); } catch(e) {}
      try { checkStreak(); } catch(e) {}
      try { renderNotes(); } catch(e) {}
    }
    // DOMContentLoaded plutôt que window.onload : voir explication dans les
    // autres pages — "load" peut ne jamais se déclencher si une ressource
    // externe est lente/bloquée, laissant la page à moitié vide.
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', benkyoInitPage);
    } else {
      benkyoInitPage();
    }
  </script>
  <script>
    /* HUD cozy : série + quêtes du jour, lues depuis le stockage local */
    (function(){
      function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
      function bar(id,p){var e=document.getElementById(id);if(e)e.style.width=Math.max(0,Math.min(100,p))+'%';}
      try{
        var s=JSON.parse(localStorage.getItem('benkyo_streak')||'null');
        var c=(s&&typeof s.count==='number')?s.count:0;
        set('streak-count',c);set('hud-streak',c);bar('hud-streak-bar',(c/30)*100);
      }catch(e){}
      try{
        var t=JSON.parse(localStorage.getItem('benkyo_todos')||localStorage.getItem('benkyo_todo')||'null');
        if(Array.isArray(t)){
          var done=t.filter(function(x){return x&&(x.done||x.completed);}).length;
          set('hud-tasks',done+'/'+t.length);bar('hud-tasks-bar',t.length?done/t.length*100:0);
        }
      }catch(e){}
      try{
        var p=JSON.parse(localStorage.getItem('benkyo_profile')||'null');
        var img=document.getElementById('sidebar-profile-img');
        if(p&&p.img&&img)img.src=p.img;
      }catch(e){}
    })();
  </script>
  <script defer src="benkyo-extras.js"></script>
</body>
